.route__n { position: relative; flex: 1 1 0; min-width: 92px; display: grid; justify-items: center; gap: 5px; text-align: center; padding-top: 14px; }
.route__n::before {
  content: "";
  position: absolute;
  top: 6px; left: 0; right: 0;
  height: 2px;
  background: var(--line-strong);
}
.route__n:first-child::before { left: 50%; }
.route__n:last-child::before { right: 50%; }
.route__dot {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--line-strong);
}
.route__n--done::before { background: var(--accent); }
.route__n--done .route__dot { background: var(--accent); border-color: var(--accent); }
.route__n--now .route__dot { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-quiet); }
.route__n--warn .route__dot { border-color: var(--warning); background: var(--warning); }
.route__n--todo .route__dot { opacity: .6; }
.route__label { font-size: var(--fs--2); color: var(--ink); line-height: 1.25; }
.route__meta { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); }

/* Diff */
.diff {
  overflow-x: auto;
  border-radius: var(--r-sm);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  font-family: var(--font-mono);
  font-size: var(--fs--1);
  line-height: 1.65;
}
.diff__file {
  padding: 7px 12px;
  border-bottom: 1px solid var(--line-inverse);
  font-size: var(--fs--2);
  color: var(--ink-inverse);
  opacity: .75;
}
.diff__ln { display: grid; grid-template-columns: 38px minmax(0, 1fr); }
.diff__ln.is-add { background: rgba(72, 160, 96, 0.18); }
.diff__ln.is-del { background: rgba(196, 72, 72, 0.18); }
.diff__n { text-align: right; padding-right: 10px; opacity: .45; user-select: none; }
.diff__ln code { padding-right: 12px; white-space: pre; }

/* Definition rows in a detail pane */
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); padding: 4px 0; font-size: var(--fs--1); }
.kv__l { color: var(--ink-faint); font-size: var(--fs--2); }
.kv__v { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink); text-align: right; }

/* Pager inside a panel */
.pagerrow {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-3); flex-wrap: wrap;
  padding: 9px 14px;
  border-top: var(--rule-w) solid var(--line);
  font-size: var(--fs--2); color: var(--ink-faint);
}
.pager__b {
  min-width: 30px; height: 30px; padding: 0 9px;
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-raised);
  color: var(--ink-muted);
  font: inherit; font-size: var(--fs--2);
  cursor: pointer;
}
.pager__b:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
.pager__b:disabled { opacity: .4; cursor: default; }
.pager__b.is-current { background: var(--accent); border-color: var(--accent); color: var(--ink-on-accent); }
.pager__gap { color: var(--ink-faint); padding: 0 2px; align-self: center; }

.modal--wide { max-width: 620px; }
.ring__sub { position: absolute; bottom: 20%; font-size: var(--fs--2); color: var(--ink-faint); }
.ring__cap { position: absolute; bottom: -22px; font-size: var(--fs--2); color: var(--ink-faint); white-space: nowrap; }

/* 17 · Responsive --------------------------------------------------------- */
/* Three columns hold to ~1000px, 900 collapsed them while there was still
   room, which made every card page feel like a list at laptop widths. */
@media (max-width: 1000px) {
  .grid--3, .grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid--sidebar, .hero--split { grid-template-columns: minmax(0, 1fr); }
  .stats { --cols: 2 !important; }
}
@media (max-width: 680px) {
  .grid--2, .grid--3, .grid--4 { grid-template-columns: minmax(0, 1fr); }
  .section-head { grid-template-columns: minmax(0, 1fr); }
  .section-head__note { text-align: left; }
  .footer__grid { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; }
  .nav__links { gap: var(--s-3); }
  .hero--full { min-height: 78vh; }
  .timeline > li { padding-left: var(--s-5); }
}

/* 18 · Print -------------------------------------------------------------- */
@media print {
  .nav, .toc, .btn, .chips { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .section { padding-block: 18pt; break-inside: avoid; }
  .card, .table-wrap { border-color: #bbb; box-shadow: none; }
  a { text-decoration: none; color: #000; }
}


/* ==========================================================================
   SENTINEL DESIGN SYSTEM · interactions.css
   --------------------------------------------------------------------------
   Motion and state. Kept in its own file so a template can ship without it ,
   print, PDFs and email never want a reveal.

   01  Motion tokens & reduced-motion contract
   02  Page entrance
   03  Reveal on scroll
   04  Nav: condense, drawer, hamburger
   05  Hover & press micro-states
   06  CTA band
   07  Charts
   08  Scroll progress
   ========================================================================== */

/* 01 · Motion tokens & reduced-motion contract --------------------------- */
:root {
  --motion-fast: 140ms;
  --motion-base: 260ms;
  --motion-slow: 520ms;
  --motion-ease: cubic-bezier(0.22, 0.68, 0.3, 1);
  --motion-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --rise: 14px;
}

/* Reduce-motion keeps feedback and drops movement. Nuking every transition
   made the whole system feel dead to anyone with macOS Reduce Motion enabled ,
   fades and colour changes are not what that setting is about. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto !important; }

  /* No travel, no zoom, no draw-on. Keep opacity and colour. */
  .reveal { transform: none !important; }
  .card:hover { transform: none !important; }
  .card:hover .card__media { transform: none !important; }
  .btn:hover, .btn:active { transform: none !important; }
  .chart .line-path { stroke-dashoffset: 0 !important; }
  .nav-drawer { transform: none !important; }

  /* Shorter, not absent. */
  .reveal, .card, .btn, .nav, .nav-drawer, .chart .donut-value {
    transition-duration: 120ms !important;
  }
}

/* 02 · Page entrance ----------------------------------------------------- */
@keyframes page-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
body { animation: page-in var(--motion-base) var(--motion-ease) both; }

/* 03 · Reveal on scroll -------------------------------------------------- */
/* Only ever applied once JS has taken over (`html.js`). Without the engine the
   page is simply visible, a broken script must never mean a blank document. */
.reveal { }                     /* marker class, no styling on its own */
html.js .reveal {
  opacity: 0;
  transform: translateY(var(--rise));
  transition:
    opacity var(--motion-slow) var(--motion-ease),
    transform var(--motion-slow) var(--motion-ease-out);
  will-change: opacity, transform;
}
html.js .reveal.is-in { opacity: 1; transform: none; }

/* Stagger children without per-item markup. */
.reveal-stagger > * { transition-delay: calc(var(--i, 0) * 70ms); }
.reveal-stagger > *:nth-child(1) { --i: 0; }
.reveal-stagger > *:nth-child(2) { --i: 1; }
.reveal-stagger > *:nth-child(3) { --i: 2; }
.reveal-stagger > *:nth-child(4) { --i: 3; }
.reveal-stagger > *:nth-child(5) { --i: 4; }
.reveal-stagger > *:nth-child(6) { --i: 5; }

/* 04 · Nav: condense, drawer, hamburger ---------------------------------- */
.nav { transition: min-height var(--motion-base) var(--motion-ease), box-shadow var(--motion-base) var(--motion-ease); }
.nav.is-condensed {
  min-height: 48px;
  box-shadow: 0 1px 0 var(--line), 0 12px 32px -24px rgba(0, 0, 0, 0.45);
}

.nav__burger {
  display: none;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: transparent;
  cursor: pointer;
  position: relative;
}
.nav__burger span {
  position: absolute;
  left: 11px;
  right: 11px;
  height: 2px;
  background: currentColor;
  transition: transform var(--motion-base) var(--motion-ease), opacity var(--motion-fast) linear;
}
.nav__burger span:nth-child(1) { top: 14px; }
.nav__burger span:nth-child(2) { top: 19px; }
.nav__burger span:nth-child(3) { top: 24px; }
.nav__burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.nav__burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav__burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

.nav-drawer {
  position: fixed;
  inset: var(--nav-h) 0 auto 0;
  z-index: 39;
  background: var(--surface-raised);
  border-bottom: 1px solid var(--line);
  padding: var(--s-4) var(--gutter) var(--s-6);
  display: grid;
  gap: 2px;
  transform: translateY(-8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-base) var(--motion-ease), transform var(--motion-base) var(--motion-ease);
}
.nav-drawer.is-open { opacity: 1; transform: none; pointer-events: auto; }
/* Inline variant for demos and footers: same behaviour, in flow. */
.nav-drawer--inline {
  position: static;
  inset: auto;
  border-radius: 0;
  border-top: 1px solid var(--line);
}
.nav-drawer a {
  padding: 12px 0;
  font-size: var(--fs-1);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
}
.nav-drawer a::after { content: "\2192"; color: var(--ink-faint); }
.nav-drawer a[aria-current="true"] { color: var(--accent); }

@media (max-width: 860px) {
  .nav__links { display: none; }
  .nav__burger { display: block; }
  .nav__actions { display: none; }
}

/* 05 · Hover & press micro-states --------------------------------------- */
.btn, .chip, .card, .nav__mark, .footer a { transition-duration: var(--motion-fast); }

.card:hover .card__media { transform: scale(1.03); }
.card__media { transition: transform var(--motion-slow) var(--motion-ease-out); }

.btn:active { transform: translateY(0) scale(0.985); }
.btn--primary-glow:hover { box-shadow: 0 12px 30px -12px var(--accent); }

.table tbody tr { transition: background-color var(--motion-fast) linear; }

/* Links in prose get an underline that grows from the left. */
.prose a {
  text-decoration: none;
  background-image: linear-gradient(var(--accent), var(--accent));
  background-size: 0% 1px;
  background-position: 0 100%;
  background-repeat: no-repeat;
  transition: background-size var(--motion-base) var(--motion-ease);
}
.prose a:hover { background-size: 100% 1px; }

/* 06 · CTA band ---------------------------------------------------------- */
.cta-band {
  border-top: var(--rule-w) solid var(--line);
  border-bottom: var(--rule-w) solid var(--line);
  background: var(--surface-sunken);
  padding-block: var(--s-8);
}
.cta-band__inner {
  display: grid;
  gap: var(--s-5);
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
}
.cta-band__title {
  font-family: var(--font-display);
  font-size: var(--fs-2);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  max-width: 26ch;
}
.cta-band__text { color: var(--ink-subtle); font-size: var(--fs--1); margin-top: var(--s-2); max-width: 44ch; }
.cta-band__actions { display: flex; gap: var(--s-3); flex-wrap: wrap; }
@media (max-width: 860px) {
  .cta-band__inner { grid-template-columns: minmax(0, 1fr); }
}

/* 07 · Charts ------------------------------------------------------------ */
.chart { display: grid; gap: var(--s-3); }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart__cap {
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.chart .bar { fill: var(--accent); }
.chart .bar--muted { fill: var(--accent-soft); }
.chart .bar:hover { fill: var(--accent-deep); }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis-label { fill: var(--ink-faint); font-family: var(--font-mono); font-size: 9px; }
.chart .line-path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line-area { fill: var(--accent-quiet); stroke: none; }
.chart .dot { fill: var(--surface-raised); stroke: var(--accent); stroke-width: 2; }
.chart .donut-track { fill: none; stroke: var(--line); stroke-width: 12; }
.chart .donut-value { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset var(--motion-slow) var(--motion-ease-out); }
.chart .donut-label { fill: var(--ink); font-family: var(--font-display); font-size: 26px; text-anchor: middle; }
.chart .donut-sub { fill: var(--ink-faint); font-family: var(--font-text); font-size: 9px; text-anchor: middle; letter-spacing: 0.12em; text-transform: uppercase; }

/* Draw the line/area once revealed. */
.chart .line-path { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); }
.chart.is-in .line-path { stroke-dashoffset: 0; transition: stroke-dashoffset 1100ms var(--motion-ease-out); }

/* 08 · Scroll progress --------------------------------------------------- */
.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 100%;
  transform: scaleX(var(--p, 0));
  transform-origin: 0 50%;
  background: var(--accent);
  z-index: 60;
  pointer-events: none;
}


/* STYLE · cold-tech, dark slate, cyan signal, mono labels. Product docs feel.
   Tight, precise, slightly cold: the voice of an engineering release note. */
:root {
  --surface: #0d1117;
  --surface-raised: #151b23;
  --surface-sunken: #080b10;
  --surface-inverse: #0d1117;

  --ink: #e6edf3;
  --ink-muted: #b9c4cf;
  --ink-subtle: #8b98a5;
  --ink-faint: #5d6a78;
  --ink-on-accent: #04121a;

  --accent: #3fb6e8;
  --accent-deep: #7fd4f5;
  --accent-soft: #1d5b74;
  --accent-quiet: rgba(63, 182, 232, 0.16);
  --surface-accent-soft: rgba(63, 182, 232, 0.1);

  --highlight: #9d8cff;
  --highlight-soft: #2a2450;

  --positive: #3fb950;
  --warning: #d29922;
  --negative: #f85149;

  --line: rgba(230, 237, 243, 0.12);
  --line-strong: rgba(230, 237, 243, 0.28);

  --scrim: linear-gradient(180deg, rgba(8, 11, 16, 0.2), rgba(8, 11, 16, 0.9));

  --font-display: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-text: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --tracking-display: -0.025em;
  --tracking-caps: 0.12em;
  --weight-display: 600;
  --lh-display: 1.02;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --density: 0.85;
}


/* sentinel-solution · theme
   --------------------------------------------------------------------------
   Tokens moved off the template: a copper signal replaces the cyan accent, and
   the display/body relationship tightens (6.8x → 5.9x at the top of the scale,
   with a wider display track). The six-category grid is the band this template
   does not ship; its rules sit below in the same idiom as the component sheet.
   -------------------------------------------------------------------------- */

:root {
  /* Accent: one copper signal, used for labels, quotes and the closing band. */
  --accent: #d9a15c;
  --accent-deep: #f0c48c;
  --accent-soft: #6b4a26;
  --accent-quiet: rgba(217, 161, 92, 0.16);
  --surface-accent: #d9a15c;
  --surface-accent-soft: rgba(217, 161, 92, 0.12);
  --ink-on-accent: #1a1206;
  --highlight: #d9c9a8;

  /* Type: the display end comes down, body goes up, the tracking widens. */
  --fs-6: clamp(3.1rem, 2.05rem + 4.7vw, 6.2rem);
  --fs-0: clamp(0.96rem, 0.93rem + 0.16vw, 1.06rem);
  --tracking-display: -0.038em;
  --lh-display: 0.94;
}

/* Specs table: full width under the heading. The key column was -faint, which
   on this ground read as a disabled control; it now sits at ink-muted (about
   9:1 on the table surface) and at the value column's size. */
.spec-table .spec-key {
  width: 28%;
  padding-right: var(--s-5);
  color: var(--ink-muted);
  font-weight: var(--weight-medium);
}

@media (max-width: 520px) {
  .spec-table { font-size: var(--fs--2); }
  .spec-table th,
  .spec-table td { padding: 8px 10px; overflow-wrap: anywhere; }
  .spec-table .spec-key { width: 42%; padding-right: var(--s-4); }
}

/* Six categories, the added band. A hairline grid of cells, no card shadows:
   the objective changes, the engine does not, and the layout says so. */
.band__note {
  margin: 0;
  max-width: 46ch;
  font-size: var(--fs--1);
  line-height: var(--lh-snug);
  color: var(--ink-muted);
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--rule-w);
  background: var(--line);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}

.cat {
  min-width: 0;
  position: relative;
  display: grid;
  align-content: space-between;
  gap: var(--s-5);
  min-height: 164px;
  padding: var(--s-5);
  background: var(--surface);
  transition: background .18s ease;
}
.cat:hover { background: var(--surface-raised); }

.cat__icon {
  width: 64px;
  height: 64px;
  color: var(--ink-subtle);
  transition: color .18s ease, transform .18s ease;
}
.cat:hover .cat__icon { color: var(--highlight); transform: translateY(-2px); }.cat__name { padding-right: 0; }

/* The open tile shows a row of objectives rather than one glyph, plus a
   two-word note, so it reads as "the set continues" and not as "nothing here". */
.cat__icons { display: flex; align-items: center; gap: var(--s-3); color: var(--ink-subtle); }
.cat__icons svg { width: 30px; height: 30px; }
.cat__note {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--highlight);
}

/* The open tile is a row of smaller objectives, icon over label, like the tiles
   above, ending in an ellipsis so the set visibly continues. */
.cat--open {
  grid-column: 1 / -1;
  display: grid;
  justify-items: center;
  text-align: center;
  gap: var(--s-5);
  min-height: 0;
  padding: var(--s-6);
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
  outline: 1px dashed color-mix(in srgb, var(--highlight) 60%, transparent);
  outline-offset: -1px;
}
.cat--open:hover { background: color-mix(in srgb, var(--accent) 11%, var(--surface)); }

.cat__more {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: var(--s-4) var(--s-4);
  max-width: 100%;
}
.cat__more-item { display: grid; justify-items: center; gap: var(--s-3); width: 68px; text-align: center; }
.cat__more-item svg { width: 28px; height: 28px; color: var(--ink-subtle); transition: color .18s ease; }
.cat--open:hover .cat__more-item svg { color: var(--highlight); }
.cat__more-item span {
  font-family: var(--font-mono);
  font-size: var(--fs--2);
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-muted);
  white-space: nowrap;
}
.cat__more-dots {
  align-self: center;
  display: grid;
  place-items: center;
  width: 40px;
  min-height: 28px;
  font-family: var(--font-display);
  font-size: var(--fs-2);
  line-height: 1;
  color: var(--highlight);
}

@media (max-width: 700px) {
  .cat__more { gap: var(--s-4) var(--s-4); }
  .cat__more-item { width: 68px; }
  .cat__more-item span { white-space: normal; }
}

.cat__name {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-1);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
}

@media (max-width: 900px) {
  .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 560px) {
  .cat-grid { grid-template-columns: minmax(0, 1fr); }
  .cat { padding: var(--s-4); }
}

/* ── Left / right rhythm ──────────────────────────────────────────────────
   Every second section puts its heading on the other side, so the page reads
   as a zig-zag rather than one long left column. Below 900px the grids already
   collapse to a single column, so the flip is switched off there. */
.flip-head.section-head { grid-template-columns: minmax(0, auto) minmax(0, 1fr); }
.flip-head.section-head > :first-child { order: 2; text-align: right; justify-self: end; }
.flip-head.section-head > .section-head__note { order: 1; text-align: left; justify-self: start; }
/* Mirrored: the rule hangs to the left of the label, so a right-hand heading
   reads as the same component turned around rather than a stranded label. */
.flip-head .eyebrow { flex-direction: row-reverse; }
.flip-head .eyebrow::after { margin-right: 0; }

.band__row.flip-head > div:first-child { order: 2; text-align: right; }
.band__row.flip-head > p { order: 1; text-align: left; }

.grid--2.flip-head > :first-child { order: 2; text-align: right; }
.grid--2.flip-head > :last-child { order: 1; }

.grid--sidebar.flip-head { grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); }
.grid--sidebar.flip-head > :first-child { order: 2; text-align: right; }
.grid--sidebar.flip-head > :last-child { order: 1; }

@media (max-width: 900px) {
  .flip-head.section-head,
  .band__row.flip-head,
  .grid--sidebar.flip-head { grid-template-columns: minmax(0, 1fr); }
  .flip-head > :first-child,
  .flip-head > :last-child { order: initial; text-align: left; }
}
/* ── The execution-loop diagram ────────────────────────────────────────────
   The diagram sits above the numbered steps and takes nothing from them: the
   columns keep their own number, rule, title and sentence at every width. */
.loop-diagram { margin: 0 0 var(--s-7); }
.loop-diagram svg { width: 100%; height: auto; display: block; }

@media (max-width: 900px) {
  .loop-diagram { display: none; }
}
/* The stages arrive in order, each with the column beneath it. The class does the
   work rather than a keyframe, so the finished state is one frame away no matter
   where the browser stops painting. */
.loop-node { opacity: 0; transform: translateY(12px); transition: opacity .62s ease, transform .62s cubic-bezier(.22, 1, .36, 1); }
.loop-node.is-in { opacity: 1; transform: none; }
.loop-arrow { opacity: 0; transition: opacity .45s ease; }
.loop-arrow.is-in { opacity: 1; }
.steps-row > li { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s cubic-bezier(.22, 1, .36, 1); }
.steps-row > li.is-in { opacity: 1; transform: none; }
/* ── The platform: one diagram per capability ──────────────────────────────
   A tile is a drawing, a name and one sentence. The grid flows 3 → 2 → 1 so the
   seventh tile never leaves a hole in a fixed column count. */
.plat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--gutter) var(--s-6);
  position: relative;
  transition: min-height .34s cubic-bezier(.2, 1, .3, 1);
}
.plat {
  display: grid;
  gap: var(--s-3);
  align-content: start;
  border-top: 1px solid var(--line);
  padding-top: var(--s-4);
  position: relative;
  outline: none;
  cursor: pointer;
  transition: transform .26s cubic-bezier(.2, 1, .3, 1), border-color .26s ease;
}
/* Pointing at a tile lifts it off the shelf. Opening it is a click. */
.plat:not(.is-open):hover { transform: translateY(-5px); border-top-color: color-mix(in srgb, var(--highlight) 45%, var(--line)); }
.plat:not(.is-open):hover .plat__glyph { color: var(--ink); }
.plat:focus-visible { outline: 1px solid var(--highlight); outline-offset: 8px; }
.plat.is-open { cursor: default; }
.plat__glyph { width: 100%; max-width: 260px; height: auto; display: block; color: var(--ink); margin-inline: auto; }
/* The drawing and its name sit on the same axis: name centred under the glyph. */
.plat__title { font-family: var(--font-display); font-size: var(--fs-0); margin: 0; text-align: center; }
.plat__note { font-size: var(--fs--1); line-height: var(--lh-text); color: var(--ink-subtle); margin: 0; max-width: 34ch; }

/* Six tiles fill a three-column grid exactly, two rows and no orphan to
   centre. */

@media (max-width: 700px) {
  .plat__glyph { max-width: 100%; }
}
/* -- A tile opens into its own explanation --------------------------------
   Point at a capability and the shelf clears: the other five step aside, the
   tile takes the whole width of the grid, and its stage plays. The sentence
   lives here rather than on the tile, so the shelf stays a row of drawings. */
.plat__note { display: none; }
.plat__panel { display: none; }

.plat-grid.is-focusing .plat:not(.is-open) { display: none; }

.plat-grid .plat.is-open {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  min-height: 100%;
  z-index: 4;
  width: auto;
  max-width: none;
  justify-self: stretch;
  align-content: stretch;
  background: var(--surface);
  border-top-color: var(--highlight);
  animation: platOpen .38s cubic-bezier(.2, 1, .3, 1);
}
.plat.is-open > .plat__glyph,
.plat.is-open > .plat__title,
.plat.is-open > .plat__note { display: none; }
.plat.is-open .plat__panel {
  display: grid;
  grid-template-columns: minmax(0, .68fr) minmax(0, 1.32fr);
  gap: var(--s-6);
  align-items: center;
  height: 100%;
}
@keyframes platOpen {
  from { opacity: 0; transform: scale(.985); }
  to { opacity: 1; transform: none; }
}
/* The hive carries four machines side by side, so it takes the whole width. */
.plat.is-open .plat__panel--wide {
  grid-template-columns: minmax(0, 1fr);
  align-content: center;
  gap: var(--s-6);
}
.plat__panel--wide .plat__brief { max-width: 62ch; }
.plat__brief { display: grid; gap: var(--s-4); align-content: center; }.plat__index { margin: 0; font-family: var(--font-mono); font-size: var(--fs--2); letter-spacing: var(--tracking-wide); color: var(--highlight); }
.plat__panel-title { margin: 0; font-family: var(--font-display); font-size: var(--fs-2); letter-spacing: var(--tracking-tight); }
/* What the acronym was cut from; its own letters carry the highlight. */
.plat__expand { margin: 0; font-family: var(--font-mono); font-size: var(--fs--2); line-height: 1.6; letter-spacing: .02em; color: var(--ink-faint); max-width: 46ch; }
.plat__expand b { font-weight: 400; color: var(--highlight); }
.plat__panel-note { margin: 0; font-size: var(--fs-0); line-height: var(--lh-text); color: var(--ink-subtle); max-width: 36ch; }
.plat__glyph--big { max-width: 340px; }

/* The ledger stage: the tile's rail and circles at full size, with the entries
   it actually holds — a timestamp, the step, and how it went. */
.lg { --lg-fail: #c1685b; position: relative; display: block; width: 100%; max-width: 560px; }
.lg-rail { position: absolute; left: 6px; top: .9em; bottom: .9em; width: 1px; background: var(--line); }
.lg-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-4); }
.lg-row {
  display: grid;
  grid-template-columns: 13px 66px minmax(0, 1fr) 14px;
  align-items: start;
  gap: var(--s-3);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .4s ease, transform .5s cubic-bezier(.2, 1, .3, 1);
}
.lg-row.is-in { opacity: 1; transform: none; }
.lg-dot {
  width: 9px;
  height: 9px;
  margin: 0 0 0 2px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  position: relative;
  z-index: 1;
  transform: translateY(.42em);
}
.lg-time { font-family: var(--font-mono); font-size: var(--fs--2); letter-spacing: var(--tracking-wide); color: var(--ink-faint); font-variant-numeric: tabular-nums; transform: translateY(.2em); }
.lg-text { font-size: var(--fs-0); line-height: 1.5; color: var(--ink-subtle); }
.lg-mark { display: block; width: 13px; height: 13px; color: var(--highlight); transform: translateY(.3em); }
.lg-mark svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
/* A step that failed is kept, not hidden: the dot, the sentence and the mark
   all carry it. */
.lg-row--fail .lg-dot { border-color: var(--lg-fail); }
.lg-row--fail .lg-text { color: var(--ink-faint); }
.lg-row--fail .lg-mark { color: var(--lg-fail); }

/* The deliverables stage: the whole scaffold library as a wall that keeps
   moving. Four columns, two up and two down, so the wall never reads as a grid
   and never stops. Each column carries its list twice and travels exactly half
   its own height, which is what makes the seam invisible. */
.mw {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  height: 300px;
  overflow: hidden;
  position: relative;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 9%, #000 91%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 9%, #000 91%, transparent);
}
.mw-col { overflow: hidden; min-width: 0; }
.mw-run { display: block; will-change: transform; animation: mwUp var(--dur, 40s) linear infinite; }
.mw-run--down { animation-name: mwDown; }
.mw-copy { display: grid; gap: 8px; padding-bottom: 8px; }
.mw-t {
  display: block;
  border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
  border-radius: 2px;
  overflow: hidden;
  background: color-mix(in srgb, var(--surface) 92%, var(--ink) 8%);
}
.mw-t img { display: block; width: 100%; height: auto; }
@keyframes mwUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@keyframes mwDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }

/* The stage: a request typed out, one arrow, then the steps it compiled to. */
.wf { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, .95fr); align-items: center; gap: var(--s-5); }
.wf-line { margin: 0; min-height: 5.2em; font-family: var(--font-mono); font-size: var(--fs-0); line-height: 1.65; color: var(--ink); }
.wf-caret { display: inline-block; width: 6px; height: 1.05em; margin-left: 1px; vertical-align: -2px; background: var(--highlight); animation: wfBlink 1.05s steps(2, start) infinite; }
.wf.is-done .wf-caret { display: none; }
@keyframes wfBlink { 50% { opacity: 0; } }

.wf-arrow { color: var(--ink-faint); opacity: 0; transform: translateX(-10px); transition: opacity .3s ease, transform .38s cubic-bezier(.2, 1, .3, 1); }
.wf-arrow svg { display: block; width: 100%; height: auto; }
.wf-arrow.is-in { opacity: 1; transform: none; }

.wf-nodes { list-style: none; margin: 0; padding: 0; display: grid; gap: 34px; }
.wf-node {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .34s ease, transform .34s cubic-bezier(.2, 1, .3, 1);
}
.wf-node::before {
  content: "";
  position: absolute;
  left: 26px;
  top: -34px;
  width: 1px;
  height: 34px;
  background: var(--line);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform .3s ease;
}
.wf-node:first-child::before { display: none; }
.wf-node.is-in { opacity: 1; transform: none; }
.wf-node.is-in::before { transform: scaleY(1); }
.wf-node__n { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--highlight); }
.wf-node__t { font-size: var(--fs-0); color: var(--ink); }

/* -- AXIS: a laptop worked from the dock ---------------------------------
   A screen, a deck, Sentinel sitting along the bottom edge. Windows open and
   close above it, and the browser is driven by finding the field, not by
   clicking a coordinate. */
.axis { width: 100%; max-width: 540px; margin: 0 auto; }
.axis-screen {
  position: relative;
  aspect-ratio: 16 / 10;
  border: 1px solid var(--line);
  border-radius: 10px 10px 3px 3px;
  overflow: hidden;
  background: color-mix(in srgb, var(--ink) 3%, transparent);
}
.axis-base {
  position: relative;
  height: 10px;
  margin: 0 -12px;
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 7px 7px;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  display: grid;
  place-items: center;
}
.axis-base::before { content: ""; width: 42px; height: 2px; border-radius: 2px; background: var(--line); }

.axis-win,
.axis-browser {
  position: absolute;
  display: grid;
  align-content: start;
  gap: 6px;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  opacity: 0;
  transform: scale(.94) translateY(6px);
  transition: opacity .3s ease, transform .36s cubic-bezier(.2, 1, .3, 1);
}
.axis-win.is-on,
.axis-browser.is-on { opacity: 1; transform: none; }
.axis-win--a { left: 8%; top: 11%; width: 42%; height: 40%; }
.axis-win--b { right: 8%; top: 17%; width: 40%; height: 36%; }
.axis-win--c { left: 15%; bottom: 25%; width: 38%; height: 32%; }
.axis-browser { left: 13%; right: 13%; top: 11%; bottom: 21%; z-index: 3; gap: 7px; }

.axis-win__bar { display: flex; align-items: center; gap: 4px; }
.axis-win__bar i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint); opacity: .6; }
.axis-win__bar b { margin-left: 4px; font-family: var(--font-mono); font-size: 8.5px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-subtle); }
.axis-win__line { display: block; height: 1px; border-radius: 1px; background: var(--ink); opacity: .16; }

.axis-browser__tabs { display: flex; }
.axis-browser__tabs i { font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-subtle); border: 1px solid var(--line); border-radius: 4px 4px 0 0; padding: 2px 7px; }
.axis-browser__url { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.axis-browser__row { display: block; height: 1px; border-radius: 1px; background: var(--ink); opacity: .14; }
.axis-browser__field {
  display: block;
  min-height: 17px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: var(--font-mono);
  font-size: 9px;
  line-height: 12px;
  color: var(--ink);
  transition: border-color .3s ease;
}
.axis-browser.is-found .axis-browser__field { border-color: color-mix(in srgb, var(--highlight) 65%, transparent); }
.axis-browser__btn { display: block; width: 20px; height: 0; padding-bottom: 10px; border: 1px solid var(--line); border-radius: 4px; }
.axis-browser.is-found .axis-browser__btn { border-color: color-mix(in srgb, var(--highlight) 65%, transparent); }
.axis-browser__found {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: .06em;
  color: var(--highlight);
  opacity: 0;
  transform: translateY(2px);
  transition: opacity .35s ease, transform .35s ease;
}
.axis-browser.is-found .axis-browser__found { opacity: 1; transform: none; }

.axis-cursor {
  position: absolute;
  left: 76%;
  top: 90%;
  width: 10px;
  height: 15px;
  z-index: 4;
  color: var(--ink);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .55));
  transition: left .7s cubic-bezier(.4, 0, .2, 1), top .7s cubic-bezier(.4, 0, .2, 1), transform .12s ease;
}
.axis-cursor svg { display: block; width: 100%; height: 100%; }
.axis-cursor.is-down { transform: scale(.82); }

.axis-dock {
  position: absolute;
  left: 50%;
  bottom: 7px;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 11px 3px 6px;
  border: 1px solid color-mix(in srgb, var(--highlight) 55%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--highlight) 10%, transparent);
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
}
.axis-dock__mark { display: block; width: 16px; height: 16px; object-fit: contain; }

/* -- Hive: one lead, four workers at the same level ----------------------
   A stem from the lead, a bus across, and a drop to each worker. They hang off
   the same line, so they read as running side by side, not in turn. A worker
   holds a spinner until it is up, and its task replaces it. */
.hive { display: grid; justify-items: center; }
.hive-lead {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 4px 5px;
  border: 1px solid color-mix(in srgb, var(--highlight) 55%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--highlight) 9%, transparent);
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .4s ease, transform .45s cubic-bezier(.2, 1, .3, 1);
}
.hive.is-on .hive-lead { opacity: 1; transform: none; }
.hive-lead__mark { display: block; width: 16px; height: 16px; object-fit: contain; }
.hive-lead__role { color: var(--ink-faint); }

.hive-stem { width: 1px; height: 18px; background: var(--line); transform: scaleY(0); transform-origin: top; transition: transform .3s ease .1s; }
.hive.is-on .hive-stem { transform: scaleY(1); }

/* Two branches, two machines each. The stem drops between the columns, the bus
   crosses the row gap, and a short drop joins each column's pair to the bus, so
   all four hang off the same line. */
.hive-tree { position: relative; width: 100%; margin-top: 18px; }
.hive-tree .hive-stem { position: absolute; left: 50%; top: -18px; bottom: 50%; height: auto; transform-origin: top; }
.hive-bus {
  position: absolute;
  top: 50%;
  left: calc(25% - 3.5px);
  right: calc(25% - 3.5px);
  height: 1px;
  background: var(--line);
  transform: scaleX(0);
  transition: transform .34s ease .18s;
}
.hive.is-on .hive-bus { transform: scaleX(1); }
.hive-drop {
  position: absolute;
  top: 50%;
  width: 1px;
  height: 26px;
  margin-top: -13px;
  background: var(--line);
  opacity: 0;
  transition: opacity .3s ease .3s;
}
.hive-drop--l { left: calc(25% - 3.5px); }
.hive-drop--r { left: calc(75% + 3.5px); }
.hive.is-on .hive-drop { opacity: 1; }

.hive-agents {
  list-style: none;
  margin: 0;
  padding: 0;
  position: relative;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 26px 14px;
  width: 100%;
}
.hive-agent {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 10px 8px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .38s ease, transform .42s cubic-bezier(.2, 1, .3, 1), border-color .3s ease;
}
.hive-agent.is-spawning,
.hive-agent.is-ready { opacity: 1; transform: none; }
.hive-agent.is-ready { border-color: color-mix(in srgb, var(--highlight) 35%, var(--line)); }

.hive-agent__slot { position: relative; width: 13px; height: 13px; }
.hive-agent__spin {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.4px solid color-mix(in srgb, var(--ink) 18%, transparent);
  border-top-color: var(--highlight);
  animation: hiveSpin .85s linear infinite;
  opacity: 0;
  transition: opacity .2s ease;
}
.hive-agent.is-spawning .hive-agent__spin { opacity: 1; }
.hive-agent__icon { position: absolute; left: -1.5px; top: -1.5px; width: 16px; height: 16px; color: var(--highlight); opacity: 0; transition: opacity .28s ease .04s; }
.hive-agent.is-ready .hive-agent__icon { opacity: 1; }
@keyframes hiveSpin { to { transform: rotate(360deg); } }

.hive-agent__task {
  font-family: var(--font-mono);
  font-size: 8.5px;
  line-height: 1.3;
  color: var(--ink-subtle);
  opacity: 0;
  transition: opacity .3s ease;
}
.hive-agent.is-ready .hive-agent__task { opacity: 1; }

.hive-agent__role {
  font-family: var(--font-display);
  font-size: 10.5px;
  line-height: 1.2;
  color: var(--ink);
  opacity: 0;
  transition: opacity .3s ease;
}
.hive-agent.is-spawning .hive-agent__role { opacity: .6; }
.hive-agent.is-ready .hive-agent__role { opacity: 1; }

/* What the worker is doing: its own machine. Same frame as the AXIS laptop,
   different work inside it, all of it driven through the interface. */
.hw { display: block; width: 100%; margin-top: 4px; text-align: left; }
/* Inside a hive card the machine waits for its worker to report ready. */
.hive-agent .hw { opacity: 0; transition: opacity .45s ease .12s; }
.hive-agent.is-ready .hw { opacity: 1; }

.mlap { display: block; width: 100%; }
.mlap__screen {
  position: relative;
  display: block;
  aspect-ratio: 16 / 10;
  border: 1px solid var(--line);
  border-radius: 4px 4px 2px 2px;
  overflow: hidden;
  background: color-mix(in srgb, var(--ink) 3%, transparent);
}
.mlap__base {
  display: block;
  height: 4px;
  margin: 0 -4px;
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 3px 3px;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
}

.mbar { display: flex; align-items: center; gap: 2px; height: 11px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.mbar i { width: 2.5px; height: 2.5px; border-radius: 50%; background: var(--ink); opacity: .38; }
.mbar b { margin-left: 3px; font-family: var(--font-mono); font-size: 5.5px; font-weight: 400; letter-spacing: .05em; color: var(--ink-subtle); }

/* The pointer, drawn the same way as the one on the AXIS laptop. */
.mcur {
  position: absolute;
  width: 6px;
  height: 9px;
  background: var(--ink);
  clip-path: polygon(0 0, 100% 63%, 52% 67%, 76% 100%, 59% 100%, 38% 69%, 0 86%);
}

/* Researcher: three real sites opened in turn, each page read line by line. */
.mtabbar { display: flex; gap: 3px; padding: 4px 5px 0; }
.mtabbar i {
  flex: 1 1 0;
  padding: 2px 4px;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 3px 3px 0 0;
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 6px;
  letter-spacing: .02em;
  text-align: left;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  animation: mTab 6.9s steps(1, end) infinite;
  animation-delay: calc(var(--t) * 2.3s);
}
@keyframes mTab {
  0%, 33.3% { color: var(--ink); background-color: color-mix(in srgb, var(--highlight) 22%, transparent); border-color: color-mix(in srgb, var(--highlight) 50%, var(--line)); }
  33.4%, 100% { color: var(--ink-faint); background-color: transparent; border-color: var(--line); }
}
.mpages2 { position: absolute; inset: 17px 0 0; overflow: hidden; }
.mpage2 {
  position: absolute;
  inset: 0;
  padding: 6px 9px;
  font-size: 9px;
  line-height: 1.62;
  text-align: left;
  color: var(--ink-subtle);
  opacity: 0;
  animation: mPage 6.9s steps(1, end) infinite;
  animation-delay: calc(var(--p) * 2.3s);
}
.mpage2 b { display: block; margin: 6px 0 5px; font-family: var(--font-display); font-size: 11px; font-weight: 400; color: var(--ink); }
.mpage2 p { margin: 0 0 7px; }
.mnav { display: flex; gap: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.mnav i { font-style: normal; font-family: var(--font-mono); font-size: 6px; letter-spacing: .04em; color: var(--ink-faint); }
.mnav i:first-child { color: var(--highlight); }
@keyframes mPage {
  0%, 33.3% { opacity: 1; }
  33.4%, 100% { opacity: 0; }
}
.mscan2 {
  position: absolute;
  left: 0;
  right: 0;
  height: 26px;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--highlight) 20%, transparent), transparent);
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--highlight) 45%, transparent);
  animation: mScan 3.2s linear infinite;
  pointer-events: none;
}
@keyframes mScan { 0% { top: -26px; } 100% { top: 100%; } }

/* Site builder: an editor with a file tree, the page typed into it. */
.mide2 { position: absolute; inset: 11px 0 0; display: flex; }
.mfiles { width: 58px; flex: 0 0 58px; padding: 6px 4px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 5px; }
.mfiles i { font-style: normal; font-family: var(--font-mono); font-size: 5.5px; letter-spacing: .02em; color: var(--ink-faint); white-space: nowrap; overflow: hidden; }
.mfiles i:first-child { color: var(--highlight); }
.mcode2 { position: relative; flex: 1 1 auto; overflow: hidden; }
.mtype {
  margin: 0;
  padding: 6px 7px;
  font-family: var(--font-mono);
  font-size: 7.5px;
  line-height: 1.75;
  text-align: left;
  color: var(--ink-subtle);
  white-space: pre-wrap;
  word-break: break-word;
}
.mtype::after { content: ""; display: inline-block; width: 4px; height: 8px; margin-left: 1px; vertical-align: -1px; background: var(--highlight); animation: wfBlink 1s steps(2, start) infinite; }

/* Reporter: a real sheet with its figures, then the bars and the pie. */
.msheet2 { position: absolute; left: 3px; top: 16px; width: 52%; display: grid; grid-auto-rows: 1fr; gap: 1px; bottom: 3px; }
.mrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; }
.mrow i {
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 1px;
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 7px;
  color: var(--ink-subtle);
  opacity: 0;
  animation: mPop 5s ease infinite;
  animation-delay: calc(var(--i) * .11s);
}
.mrow--head i { color: var(--ink); background-color: color-mix(in srgb, var(--ink) 6%, transparent); }
@keyframes mPop {
  0%, 4% { opacity: 0; color: var(--highlight); background-color: color-mix(in srgb, var(--highlight) 30%, transparent); }
  14%, 88% { opacity: 1; color: var(--ink-subtle); background-color: transparent; }
  100% { opacity: 0; }
}
.mcharts2 { position: absolute; right: 4px; top: 16px; width: 43%; bottom: 3px; display: grid; align-content: center; gap: 10px; justify-items: center; }
.mbars2 { display: flex; align-items: flex-end; gap: 3px; width: 100%; height: 52px; border-bottom: 1px solid var(--line); }
.mbars2 i { flex: 1 1 0; border-radius: 1px 1px 0 0; background: color-mix(in srgb, var(--highlight) 62%, transparent); height: 0; animation: mGrow 5s cubic-bezier(.2, 1, .3, 1) infinite; animation-delay: var(--d); }
@keyframes mGrow { 0%, 5% { height: 0; } 26%, 86% { height: calc(var(--h) * 1%); } 96%, 100% { height: 0; } }
.mpie2 { width: 34px; height: 34px; color: color-mix(in srgb, var(--highlight) 80%, transparent); }
.mpie2 circle { animation: mPie 5s ease infinite; }
/* The ring closes: it starts at nothing and ends as a whole circle. */
@keyframes mPie { 0%, 16% { stroke-dashoffset: 50.27; } 54%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 50.27; } }

/* Messenger: a compose window drafted, sent, and the confirmation card. */
.mgmail {
  position: absolute;
  inset: 11px 5px 5px;
  display: grid;
  grid-template-rows: auto auto auto 1fr auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  transition: opacity .35s ease, transform .35s ease;
}
.mgmail__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 6px;
  background: color-mix(in srgb, var(--ink) 7%, transparent);
  border-bottom: 1px solid var(--line);
}
.mgmail__bar b { font-family: var(--font-mono); font-size: 6.5px; font-weight: 400; letter-spacing: .06em; color: var(--ink); }
.mgmail__bar em { width: 5px; height: 5px; border: 1px solid var(--ink-faint); transform: rotate(45deg); }
.mgmail__field { display: flex; align-items: baseline; gap: 5px; padding: 3px 6px; border-bottom: 1px solid var(--line); }
.mgmail__field em { font-style: normal; font-family: var(--font-mono); font-size: 6px; color: var(--ink-faint); }
.mgmail__field b { font-family: var(--font-mono); font-size: 6.5px; font-weight: 400; color: var(--ink-subtle); }
.mgmail__body { position: relative; overflow: hidden; }
.mgmail__body .mtype { padding: 5px 6px; font-size: 7.5px; line-height: 1.7; color: var(--ink-subtle); }
.mgmail__foot { display: flex; align-items: center; gap: 5px; padding: 4px 6px; border-top: 1px solid var(--line); }
.msendbtn {
  padding: 2px 9px;
  border-radius: 3px;
  background: color-mix(in srgb, var(--highlight) 78%, transparent);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 6.5px;
  font-weight: 400;
  letter-spacing: .06em;
  transition: background-color .18s ease, transform .18s ease;
}
.mcur--send { position: absolute; width: 7px; height: 10px; background: var(--ink); clip-path: polygon(0 0, 100% 63%, 52% 67%, 76% 100%, 59% 100%, 38% 69%, 0 86%); }
.mgmail__foot .mcur--send { position: static; margin-left: 2px; opacity: 0; transition: opacity .3s ease; }
.mlap__screen.is-press .msendbtn { background: var(--highlight); transform: scale(.94); }
.mlap__screen.is-press .mcur--send { opacity: 1; }

.msent {
  position: absolute;
  inset: 0;
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 6px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .4s ease, transform .4s cubic-bezier(.2, 1, .3, 1);
}
.msent__av {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid color-mix(in srgb, var(--highlight) 55%, transparent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--highlight) 12%, transparent);
  color: var(--highlight);
}
.msent__av svg { width: 20px; height: 20px; }
.msent b { font-family: var(--font-display); font-size: 9.5px; font-weight: 400; color: var(--ink); }
.msent i { font-style: normal; font-family: var(--font-mono); font-size: 6px; color: var(--ink-faint); }
.mlap__screen.is-sent .mgmail { opacity: 0; transform: scale(.97); }
.mlap__screen.is-sent .msent { opacity: 1; transform: none; }

/* -- BIFROST: two devices, one run, and a view that spins between them ---- */
.bi { position: relative; display: block; width: 100%; max-width: 860px; margin-inline: auto; aspect-ratio: 16 / 6.4; max-height: 420px; perspective: 1600px; }
.bi-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.6, 0, .3, 1); }
.bi-flip.is-back { transform: rotateY(180deg); }
.bi-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 5%; backface-visibility: hidden; }
.bi-face--b { transform: rotateY(180deg); }
.bi-ctl { position: absolute; top: 0; right: 0; }
.bi-ctl b {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-subtle);
  cursor: pointer;
  transition: color .2s ease, border-color .2s ease;
}
.bi-ctl b:hover { color: var(--ink); border-color: color-mix(in srgb, var(--highlight) 45%, var(--line)); }
.bi-ctl.is-paused b { color: var(--highlight); border-color: color-mix(in srgb, var(--highlight) 55%, transparent); }

.bi-lap { position: relative; display: block; width: 58%; }
.bi-lap__screen { position: relative; display: block; padding: 3.4%; border: 1px solid var(--line); border-radius: 9px 9px 4px 4px; background: color-mix(in srgb, var(--ink) 8%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 6%, transparent); }
.bi-lap__display { position: relative; display: block; aspect-ratio: 16 / 10; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--ink) 3%, transparent); container-type: inline-size; --u: 1cqw; }
.bi-lap__base { display: block; height: 7px; margin: 0 -7px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 5px 5px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
.bi-dock {
  position: absolute;
  left: 50%;
  bottom: 1.8cqw;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 1.6cqw;
  padding: 0.8cqw 2.8cqw 0.8cqw 1cqw;
  border: 1px solid color-mix(in srgb, var(--highlight) 50%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--highlight) 10%, transparent);
  font-family: var(--font-mono);
  font-size: 2.6cqw;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink);
}
.bi-dock img { width: 4.6cqw; height: 4.6cqw; }

.bi-phone { position: relative; display: block; height: 86%; aspect-ratio: 9 / 17; padding: 4px; border: 1px solid var(--line); border-radius: 13px; background: color-mix(in srgb, var(--ink) 4%, transparent); }
.bi-notch { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 26%; height: 3px; border-radius: 2px; background: var(--line); z-index: 3; }
.bi-screen { position: relative; display: grid; grid-template-rows: auto 1fr auto; height: 100%; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; container-type: inline-size; --u: 2.3cqw; }

.bi-app { display: contents; }
.bi-app__head { display: flex; align-items: center; gap: 3px; padding: 7px 5px 3px; border-bottom: 1px solid var(--line); }
.bi-app__head b { font-family: var(--font-mono); font-size: 6.6cqw; font-weight: 400; letter-spacing: .06em; color: var(--ink); }
.bi-app__head img { width: 7.2cqw; height: 7.2cqw; }
.bi-app__head--wa { justify-content: center; }
.bi-thread { display: grid; align-content: start; gap: 4px; padding: 5px; overflow: hidden; min-height: 0; }
.bi-msg {
  justify-self: start;
  padding: 3cqw 4.6cqw;
  border-radius: 5cqw;
  font-size: 6.6cqw;
  line-height: 1.45;
  color: var(--ink-subtle);
  display: none;
}
.bi-msg.is-on { display: block; opacity: 1; animation: biIn .32s ease both; }
.bi-msg--card.is-on { display: grid; }
@keyframes biIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.bi-msg--out { justify-self: end; background: color-mix(in srgb, var(--highlight) 22%, transparent); color: var(--ink); }
.bi-msg--in { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.bi-msg--card { display: none; gap: 2px; border: 1px solid color-mix(in srgb, var(--highlight) 45%, transparent); }
.bi-msg--card b { font-family: var(--font-display); font-size: 7.8cqw; font-weight: 400; color: var(--ink); }
.bi-msg--card i { font-style: normal; font-size: 6.4cqw; color: var(--highlight); }
.bi-msg--file { display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--highlight) 18%, transparent); color: var(--ink); }
.bi-file { width: 5cqw; height: 6.4cqw; border: 1px solid var(--highlight); border-radius: 1px; }

.bi-comp { display: flex; align-items: flex-end; gap: 4px; padding: 4px 5px; border-top: 1px solid var(--line); }
.bi-comp__text { flex: 1 1 auto; max-height: 3.6em; overflow: hidden; font-size: 6.4cqw; line-height: 1.4; color: var(--ink-subtle); }
.bi-btn { width: 11cqw; height: 11cqw; flex: 0 0 11cqw; border-radius: 50%; background: color-mix(in srgb, var(--highlight) 70%, transparent); }
.bi-comp--wa .bi-comp__text { color: var(--ink-faint); }

.bi-run { position: absolute; inset: 2.6cqw 3cqw 9cqw; display: grid; align-content: start; gap: 1.8cqw; opacity: 0; transition: opacity .35s ease; }
.bi-run.is-on { opacity: 1; }
.bi-idle {
  position: absolute;
  inset: 0;
  display: none;
  place-content: center;
  justify-items: center;
  opacity: 0;
}
.bi-idle.is-on { display: grid; opacity: 1; animation: biIn .4s ease both; }
.bi-idle span {
  font-family: var(--font-mono);
  font-size: calc(var(--u) * 2.2);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
/* The handheld's own app screen, shown when the request lands. */
.bi-pane--apps { padding: calc(var(--u) * 2.2); }
.bi-apps { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u) * 2.4); }
.bi-app-icon { display: grid; justify-items: center; gap: calc(var(--u) * 1.4); }
.bi-app-icon i {
  display: grid;
  place-items: center;
  width: calc(var(--u) * 13);
  height: calc(var(--u) * 13);
  border: 1px solid var(--line);
  border-radius: calc(var(--u) * 3);
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  color: var(--highlight);
}
.bi-app-icon svg { width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
.bi-app-icon b { font-family: var(--font-mono); font-size: calc(var(--u) * 2.4); font-weight: 400; letter-spacing: .04em; color: var(--ink-subtle); }
.bi-run__h { font-family: var(--font-display); font-size: 4cqw; color: var(--ink); }
.bi-step { display: flex; align-items: center; gap: 1.8cqw; font-size: 3.1cqw; color: var(--ink-faint); }
.bi-step i { width: 3.1cqw; height: 3.1cqw; flex: 0 0 3.1cqw; border: 1px solid var(--line); border-radius: 50%; position: relative; }
.bi-step.is-run i { border-top-color: var(--highlight); animation: biSpin .8s linear infinite; }
@keyframes biSpin { to { transform: rotate(360deg); } }
.bi-step.is-on { color: var(--ink); }
.bi-step.is-on i { border-color: color-mix(in srgb, var(--highlight) 70%, transparent); }
.bi-step.is-on i::after {
  content: "";
  position: absolute;
  left: 0.3cqw;
  top: 0.7cqw;
  width: 1.3cqw;
  height: 0.7cqw;
  border-left: 1px solid var(--highlight);
  border-bottom: 1px solid var(--highlight);
  transform: rotate(-45deg);
}

.bi-cmd { position: absolute; inset: 2.6cqw 3cqw 9cqw; display: grid; align-content: start; gap: 2cqw; opacity: 0; transition: opacity .35s ease; }
.bi-cmd.is-on { opacity: 1; }
.bi-cmd__h { display: flex; align-items: center; gap: 1cqw; font-family: var(--font-mono); font-size: 2.6cqw; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.bi-cmd__h img { width: 3.2cqw; height: 3.2cqw; }
.bi-cmd__text { font-size: 3.5cqw; line-height: 1.5; color: var(--ink); }

/* The confirmation the desktop shows once the mail is away. */
.bi-done {
  position: absolute;
  inset: 0;
  display: none;
  align-content: center;
  justify-items: center;
  gap: 2.4cqw;
  opacity: 0;
}
.bi-done.is-on { display: grid; opacity: 1; animation: biIn .35s ease both; }
.bi-done__av {
  display: grid;
  place-items: center;
  width: 13cqw;
  height: 13cqw;
  border: 1px solid color-mix(in srgb, var(--highlight) 55%, transparent);
  border-radius: 50%;
  background: color-mix(in srgb, var(--highlight) 12%, transparent);
  color: var(--highlight);
}
.bi-done__av svg { width: 7cqw; height: 7cqw; }
.bi-done b { font-family: var(--font-display); font-size: 3.6cqw; font-weight: 400; color: var(--ink); }
.bi-done i { font-style: normal; font-family: var(--font-mono); font-size: 2.1cqw; letter-spacing: .04em; color: var(--ink-faint); }

/* The desktop's side: the mail it received, then the mail it sends. */
.bi-inbox, .bi-lap__display .bi-mail { position: absolute; inset: 2.6cqw 3cqw 9cqw; display: grid; align-content: start; gap: 1.6cqw; opacity: 0; transition: opacity .35s ease; }
.bi-inbox.is-on, .bi-lap__display .bi-mail.is-on { opacity: 1; }
/* The handheld's side: a folder, then its own compose window. */
.bi-pane { display: none; align-content: start; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 1.6); border: 1px solid var(--line); border-radius: calc(var(--u) * 2); }
.bi-pane.is-on { display: grid; opacity: 1; animation: biIn .32s ease both; }
.bi-win__h { font-family: var(--font-mono); font-size: calc(var(--u) * 2.4); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); padding-bottom: calc(var(--u) * 1.2); border-bottom: 1px solid var(--line); }
.bi-row { display: flex; align-items: center; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 1.2) calc(var(--u) * 1); border-radius: 2px; font-size: calc(var(--u) * 2.7); color: var(--ink-subtle); }
.bi-row.is-pick { background: color-mix(in srgb, var(--highlight) 16%, transparent); color: var(--ink); }
.bi-folder { width: calc(var(--u) * 3.4); height: calc(var(--u) * 2.6); flex: 0 0 auto; border: 1px solid var(--highlight); border-radius: 1px; }
.bi-doc { width: calc(var(--u) * 2.6); height: calc(var(--u) * 3.4); flex: 0 0 auto; border: 1px solid var(--line); border-radius: 1px; }
.bi-row.is-pick .bi-doc, .bi-att .bi-doc { border-color: color-mix(in srgb, var(--highlight) 55%, transparent); }
.bi-line { display: flex; gap: calc(var(--u) * 1.6); font-size: calc(var(--u) * 2.7); color: var(--ink-subtle); }
.bi-line em { font-style: normal; font-family: var(--font-mono); font-size: calc(var(--u) * 2.4); color: var(--ink-faint); }
.bi-att { display: flex; align-items: center; gap: calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.5); color: var(--ink); padding: calc(var(--u) * .8) calc(var(--u) * 1); border: 1px solid color-mix(in srgb, var(--highlight) 40%, transparent); border-radius: 2px; opacity: 0; transform: translateY(3px); transition: opacity .32s ease, transform .32s ease; }
.bi-att.is-on { opacity: 1; transform: none; }
/* Files added while forwarding carry a copper dot, so the ones that came with
   the mail and the ones put in by hand read differently. */
.bi-att--added { border-style: dashed; }
.bi-att--added .bi-doc { border-color: var(--highlight); }
.bi-send { justify-self: start; padding: calc(var(--u) * .8) calc(var(--u) * 2.6); border-radius: 3px; background: color-mix(in srgb, var(--highlight) 78%, transparent); color: var(--surface); font-family: var(--font-mono); font-size: calc(var(--u) * 2.5); transition: transform .18s ease, background-color .18s ease; }
.bi.is-press .bi-send { background: var(--highlight); transform: scale(.94); }

.bi-bar { display: block; height: 1cqw; margin-top: 1.4cqw; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
.bi-bar i { display: block; width: 0; height: 100%; border-radius: 999px; background: color-mix(in srgb, var(--highlight) 75%, transparent); transition: width .45s cubic-bezier(.3, 1, .4, 1); }
.bi-note { font-family: var(--font-mono); font-size: 2.5cqw; letter-spacing: .04em; color: var(--ink-faint); }

@media (max-width: 680px) {
  .plat__note { display: block; }
}
/* -- Section separator ----------------------------------------------------
   The platform section shares the surface above it, so it needs a hairline to
   read as a new section. Full bleed, edge to edge, matching the band edges
   elsewhere on the page rather than stopping at the content column. */
#specs { position: relative; }
#specs::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 100vw;
  transform: translateX(-50%);
  height: var(--rule-w);
  background: var(--line);
}

/* -- Brand mark ----------------------------------------------------------- */.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand__mark { display: block; width: 40px; height: 40px; object-fit: contain; }

/* -- Why one engine: two shapes, one row -------------------------------- */
.why-pair {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gutter);
  align-items: start;
}
.why-panel {
  display: grid;
  gap: var(--s-4);
  align-content: start;
  border-top: 1px solid var(--line);
  padding-top: var(--s-4);
}
.why-panel--one { border-top-color: color-mix(in srgb, var(--highlight) 55%, transparent); }
.why-svg { width: 100%; height: auto; display: block; color: var(--ink); }
.why-panel__title { margin: 0; font-family: var(--font-display); font-size: var(--fs-1); letter-spacing: var(--tracking-tight); }
.why-panel__line { margin: 0; font-size: var(--fs--1); line-height: var(--lh-text); color: var(--ink-subtle); max-width: 46ch; }

@media (max-width: 900px) {
  .why-pair { grid-template-columns: minmax(0, 1fr); }
}
/* -- Why one engine: motion ---------------------------------------------- */
@keyframes chaosFlow { to { stroke-dashoffset: -18; } }
.chaos-link { stroke-dasharray: 4 5; stroke-opacity: .3; }
.chaos-link.is-live { animation: chaosFlow 1.8s linear infinite; }
.chaos-link.is-dead { stroke-opacity: .13; }
.chaos-box.is-dead rect { stroke-opacity: .2; stroke-dasharray: 3 4; }
.chaos-box.is-dead text { fill-opacity: .3; }

@keyframes chaosBreak { 0%, 100% { opacity: .28; } 50% { opacity: .9; } }
.chaos-breaks path,
.chaos-dot { animation: chaosBreak 2.8s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .45s); }

.fan-node { cursor: pointer; }
.fan-node rect { transition: fill .2s ease, stroke-width .2s ease; }
.fan-node:hover rect { fill: color-mix(in srgb, var(--highlight) 12%, transparent); }
.fan-node:focus-visible { outline: none; }
.fan-node:focus-visible rect { stroke-width: 2.6; }

.fan-line {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset .42s ease-out;
}
.fan-line.is-in { stroke-dashoffset: 0; }
.fan-tile {
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity .36s ease, transform .36s ease;
}
.fan-tile.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .chaos-link.is-live,
  .chaos-breaks path,
  .chaos-dot { animation: none; }
  .fan-line, .fan-tile { transition: none; }
}

</style>
