<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sentinel: one engine for autonomous work</title>
  <meta name="description" content="Sentinel is a desktop workbench for autonomous work: a plain-English goal becomes a structured execution plan, runs across real applications with coordinated AI agents, and returns a finished artefact plus an auditable record. Hackathon submission for SDSI, category: Others." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sentinel: one engine for autonomous work" />
  <meta property="og:description" content="Workflow compilation, desktop automation (AXIS), agent orchestration (Hive), cross-device control (BIFROST), deliverable generation and an execution ledger: one platform across six business categories." />
  <link rel="alternate" type="application/vnd.openxmlformats-officedocument.presentationml.presentation" href="sentinel-solution.pptx" title="Sentinel submission deck (PPTX)" />

<style>
/* ==========================================================================
   SENTINEL DESIGN SYSTEM · tokens.css
   --------------------------------------------------------------------------
   Layer 1  primitives   (raw scales, never used directly by components)
   Layer 2  semantics    (what a component is allowed to reference)
   Layer 3  type         (families, fluid scale, rhythm)
   Layer 4  space/layout (scale, wrap widths, gutter)
   Layer 5  surface      (radius, shadow, motion, density)

   A *style* file overrides layer 2 and layer 3 only. That is the contract:
   styles change colour and voice, never structure. An archetype that needs a
   structural change gets its own archetype, not a style hack.
   ========================================================================== */

:root {
  /* 01 · primitives ------------------------------------------------------- */
  /* Neutrals, light end. Warm by default; a style may neutralise them. */
  --p-white: #fffefb;
  --p-50: #fbf8f1;
  --p-100: #f7f3ea;
  --p-200: #efe8d9;
  --p-300: #e2dac8;
  --p-400: #cfc5ae;
  --p-500: #a89e88;
  --p-600: #7d7566;
  --p-700: #57503f;
  --p-800: #3a3630;
  --p-900: #23201a;
  --p-950: #141310;

  /* Accents, one hue family per role, three steps each. */
  --a-green-700: #17352a;
  --a-green-600: #1f4d3a;
  --a-green-300: #7fa992;
  --a-blue-700: #1a3f56;
  --a-blue-600: #22506b;
  --a-blue-300: #7fa6bd;
  --a-gold-600: #b8893b;
  --a-gold-400: #d9b36a;
  --a-gold-200: #eddcb6;
  --a-red-600: #a9483a;
  --a-red-300: #d69b90;

  /* 02 · semantics -------------------------------------------------------- */
  --surface: var(--p-100);
  --surface-raised: var(--p-white);
  --surface-sunken: var(--p-200);
  --surface-inverse: var(--p-950);
  --surface-accent: var(--a-green-600);
  --surface-accent-soft: rgba(31, 77, 58, 0.08);

  --ink: var(--p-950);
  --ink-muted: var(--p-800);
  --ink-subtle: var(--p-600);
  --ink-faint: var(--p-500);
  --ink-inverse: var(--p-100);
  --ink-on-accent: var(--p-white);

  --accent: var(--a-green-600);
  --accent-deep: var(--a-green-700);
  --accent-soft: var(--a-green-300);
  --accent-quiet: rgba(31, 77, 58, 0.14);

  --highlight: var(--a-gold-600);
  --highlight-soft: var(--a-gold-200);

  --positive: var(--a-green-600);
  --warning: var(--a-gold-600);
  --negative: var(--a-red-600);

  --line: rgba(20, 19, 16, 0.13);
  --line-strong: rgba(20, 19, 16, 0.26);
  --line-inverse: rgba(255, 254, 251, 0.22);

  /* Hero scrim: readable over any photo, tuned per style. */
  --scrim: linear-gradient(
    180deg,
    rgba(20, 19, 16, 0.06) 0%,
    rgba(20, 19, 16, 0.28) 46%,
    rgba(20, 19, 16, 0.72) 100%
  );
  --scrim-flat: rgba(20, 19, 16, 0.38);

  /* 03 · type ------------------------------------------------------------- */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino,
    "Book Antiqua", Georgia, "Times New Roman", serif;
  --font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
    "Liberation Mono", monospace;

  /* Fluid scale: 1.25 ratio at small widths, ~1.32 at large. */
  --fs--2: clamp(0.69rem, 0.67rem + 0.1vw, 0.75rem);   /* 11-12  micro caps */
  --fs--1: clamp(0.78rem, 0.75rem + 0.14vw, 0.86rem);  /* 12.5-13.8 secondary */
  --fs-0: clamp(0.95rem, 0.92rem + 0.15vw, 1.03rem);   /* 15-16.5 body */
  --fs-1: clamp(1.09rem, 1.04rem + 0.24vw, 1.25rem);   /* lede */
  --fs-2: clamp(1.31rem, 1.2rem + 0.55vw, 1.66rem);    /* h3 */
  --fs-3: clamp(1.62rem, 1.42rem + 0.95vw, 2.2rem);    /* h2 */
  --fs-4: clamp(2rem, 1.62rem + 1.8vw, 3.05rem);       /* h1 inner */
  --fs-5: clamp(2.6rem, 1.9rem + 3.2vw, 4.6rem);       /* hero */
  --fs-6: clamp(3.4rem, 2.2rem + 5.4vw, 7rem);         /* display */

  --lh-display: 0.98;
  --lh-tight: 1.14;
  --lh-snug: 1.32;
  --lh-text: 1.62;
  --lh-loose: 1.75;

  --tracking-display: -0.022em;
  --tracking-tight: -0.012em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-caps: 0.14em;

  --weight-body: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-display: 400;

  /* 04 · space & layout --------------------------------------------------- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 72px;
  --s-9: 104px;
  --s-10: 144px;

  /* One multiplier the whole layout respects. Body copy stays full size;
     structure breathes or tightens. */
  --density: 1;
  --section-gap: calc(var(--s-8) * var(--density));
  --block-gap: calc(var(--s-5) * var(--density));
  --card-pad: calc(var(--s-5) * var(--density));
  --row-pad: calc(var(--s-3) * var(--density));

  --wrap: 1180px;
  --wrap-narrow: 720px;
  --wrap-wide: 1440px;
  --gutter: clamp(18px, 4.6vw, 56px);
  --nav-h: 62px;
  --rule-w: 1px;

  /* 05 · surface ---------------------------------------------------------- */
  --r-sm: 4px;
  --r-md: 10px;
  --r-lg: 18px;
  --r-xl: 28px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(20, 19, 16, 0.05),
    0 8px 24px -12px rgba(20, 19, 16, 0.18);
  --shadow-2: 0 2px 4px rgba(20, 19, 16, 0.06),
    0 22px 48px -20px rgba(20, 19, 16, 0.28);
  --shadow-inset: inset 0 0 0 1px var(--line);

  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-1: 120ms;
  --dur-2: 220ms;
  --dur-3: 420ms;

  /* 06 · density modes ---------------------------------------------------- */
}

/* Structural density is a document-level choice, not a per-component one. */
[data-density="compact"] { --density: 0.72; }
[data-density="comfortable"] { --density: 1; }
[data-density="airy"] { --density: 1.35; }

/* Night surfaces: any style can flip a subtree into dark treatment. */
[data-surface="inverse"] {
  --surface: var(--p-950);
  --surface-raised: var(--p-900);
  --surface-sunken: var(--p-800);
  --ink: var(--p-50);
  --ink-muted: var(--p-200);
  --ink-subtle: var(--p-400);
  --ink-faint: var(--p-500);
  --line: var(--line-inverse);
  --line-strong: rgba(255, 254, 251, 0.34);
}


/* ==========================================================================
   SENTINEL DESIGN SYSTEM · components.css
   --------------------------------------------------------------------------
   Every rule here references semantics from tokens.css only, never a raw
   primitive, never a hue by name. That is what lets one archetype be re-skinned
   by swapping a style file.

   01  Reset & base
   02  Layout           .wrap .stack .grid .rule
   03  Type utilities   .eyebrow .lede .caps .num
   04  Nav              .nav
   05  Hero             .hero (full / split / type)
   06  Section frame    .section .section-head
   07  Cards            .card
   08  Data table       .table
   09  Stats            .stats .stat
   10  Timeline         .timeline
   11  Chips & badges   .chips .chip .badge
   12  Figures          .figure
   13  Callout & quote  .callout .quote
   14  Buttons          .btn
   15  TOC              .toc
   16  Footer           .footer
   17  Responsive
   18  Print
   ========================================================================== */

/* 01 · Reset & base ------------------------------------------------------- */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 16px);
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: var(--fs-0);
  line-height: var(--lh-text);
  font-weight: var(--weight-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img { display: block; max-width: 100%; height: auto; }

h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: var(--weight-display); }
p { margin: 0; }
a { color: inherit; }
ul, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }

:where(a, button, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

::selection { background: var(--accent-quiet); color: var(--ink); }

/* 02 · Layout ------------------------------------------------------------- */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.wrap--narrow { max-width: var(--wrap-narrow); }
.wrap--wide { max-width: var(--wrap-wide); }

.stack > * + * { margin-top: var(--block-gap); }
.stack--tight > * + * { margin-top: var(--s-3); }
.stack--loose > * + * { margin-top: var(--s-7); }

.grid {
  display: grid;
  gap: var(--block-gap);
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
}
.grid--2 { --cols: 2; }
.grid--3 { --cols: 3; }
.grid--4 { --cols: 4; }
.grid--sidebar { grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); }

.rule {
  height: var(--rule-w);
  border: 0;
  margin: 0;
  background: var(--line);
}

/* 03 · Type utilities ----------------------------------------------------- */
.eyebrow {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-family: var(--font-text);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-subtle);
  font-weight: var(--weight-semibold);
}
.eyebrow::after {
  content: "";
  flex: 1;
  height: var(--rule-w);
  background: var(--line);
}

.lede {
  font-size: var(--fs-1);
  line-height: var(--lh-snug);
  color: var(--ink-muted);
  max-width: 62ch;
}

.caps {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-subtle);
  font-weight: var(--weight-semibold);
}

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-subtle); }
.tight { letter-spacing: var(--tracking-tight); }

/* 04 · Nav ---------------------------------------------------------------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-5);
  min-height: var(--nav-h);
  padding-inline: var(--gutter);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: var(--rule-w) solid var(--line);
}
.nav__mark {
  font-family: var(--font-display);
  font-size: var(--fs-1);
  letter-spacing: var(--tracking-tight);
  text-decoration: none;
  white-space: nowrap;
}
.nav__links {
  display: flex;
  gap: var(--s-5);
  list-style: none;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav__links::-webkit-scrollbar { display: none; }
/* When there are more sections than fit, the list scrolls, fade the edge so it
   reads as "there is more" instead of a truncated word. */
@media (max-width: 1100px) {
  .nav__links {
    mask-image: linear-gradient(90deg, #000 86%, transparent 100%);
    padding-right: 20px;
  }
}
.nav__links a {
  font-size: var(--fs--1);
  text-decoration: none;
  color: var(--ink-subtle);
  white-space: nowrap;
  padding-block: 6px;
  border-bottom: 2px solid transparent;
  transition: color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.nav__links a:hover,
.nav__links a[aria-current="true"] {
  color: var(--ink);
  border-bottom-color: var(--accent);
}

/* 05 · Hero --------------------------------------------------------------- */
.hero { position: relative; isolation: isolate; }

.hero--full {
  min-height: min(86vh, 780px);
  display: grid;
  align-items: end;
  color: var(--ink-inverse);
  background: var(--surface-inverse);
}
.hero--full .hero__media {
  position: absolute;
  inset: 0;
  z-index: -1;
  object-fit: cover;
  width: 100%;
  height: 100%;
}
.hero--full::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--scrim);
}
.hero--full .hero__body { padding-block: var(--s-9) var(--s-8); }

.hero--split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
  align-items: center;
  gap: var(--s-7);
  padding-block: var(--s-8);
}
.hero--split .hero__media {
  border-radius: var(--r-lg);
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

.hero--type { padding-block: var(--s-9); }

.hero__kicker {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--highlight);
  font-weight: var(--weight-semibold);
  margin-bottom: var(--s-4);
}
.hero__title {
  font-family: var(--font-display);
  font-size: var(--fs-5);
  line-height: var(--lh-display);
  letter-spacing: var(--tracking-display);
  max-width: 22ch;
}
.hero--full .hero__title { max-width: 18ch; }
.hero__lede {
  margin-top: var(--s-4);
  font-size: var(--fs-1);
  line-height: var(--lh-snug);
  max-width: 46ch;
  opacity: 0.92;
}
.hero__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2) var(--s-5);
  margin-top: var(--s-6);
  padding-top: var(--s-4);
  border-top: var(--rule-w) solid currentColor;
  font-size: var(--fs--1);
  opacity: 0.86;
}
.hero__meta span { white-space: nowrap; }

/* 06 · Section frame ------------------------------------------------------ */
.section { padding-block: var(--section-gap); }
.section + .section { border-top: var(--rule-w) solid var(--line); }
.section--sunken { background: var(--surface-sunken); }
.section--raised { background: var(--surface-raised); }

.section-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, auto);
  align-items: end;
  gap: var(--s-5);
  margin-bottom: var(--block-gap);
}
.section-head__index {
  font-family: var(--font-mono);
  font-size: var(--fs--1);
  color: var(--ink-faint);
  letter-spacing: var(--tracking-wide);
}
.section-head__title {
  font-family: var(--font-display);
  font-size: var(--fs-3);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin-top: var(--s-2);
  max-width: 24ch;
}
.section-head__note {
  font-size: var(--fs--1);
  color: var(--ink-subtle);
  max-width: 34ch;
  text-align: right;
}

/* The premise, said twice: the same call made by a person and by the agent.
   This is the whole argument for "the desktop is the API" in two rows. */

/* 07 · Cards -------------------------------------------------------------- */
.card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface-raised);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
  transition: border-color var(--dur-2) var(--ease),
    transform var(--dur-2) var(--ease-out),
    box-shadow var(--dur-2) var(--ease);
}
.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-1);
}
.card--flat { border-radius: 0; border-width: 0 0 var(--rule-w); background: transparent; }
.card--flat:hover { transform: none; box-shadow: none; }

.card__media {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  background: var(--surface-sunken);
}
.card__body { padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--s-3); }
.card__meta {
  display: flex;
  justify-content: space-between;
  gap: var(--s-3);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.card__title {
  font-family: var(--font-display);
  font-size: var(--fs-2);
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-tight);
}
.card__text { color: var(--ink-muted); font-size: var(--fs--1); line-height: var(--lh-text); }
.card__foot {
  margin-top: auto;
  padding-top: var(--s-3);
  border-top: var(--rule-w) solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s-3);
  font-size: var(--fs--1);
}

/* 07b · Hero actions, split, steps, logos, pricing, faq -------------------- */
.hero__actions { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-top: var(--s-5); }

/* A copy/figure pair. Flips with grid--flip on wide screens only. */
.split { align-items: center; }
@media (min-width: 1001px) {
  .grid--flip > :first-child { order: 2; }
}

.steps { list-style: none; display: grid; gap: var(--block-gap); }
.steps > li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--s-4); align-items: start; }
.steps__n {
  font-family: var(--font-mono);
  font-size: var(--fs--1);
  color: var(--highlight);
  border-top: 2px solid var(--accent);
  padding-top: 6px;
}

.logos {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-6);
  align-items: baseline;
  opacity: 0.75;
  font-family: var(--font-display);
  font-size: var(--fs-1);
  letter-spacing: var(--tracking-tight);
}

.card--featured {
  border-width: 2px;
  border-color: var(--accent);
  box-shadow: var(--shadow-1);
}

.faq { display: grid; gap: 0; border-top: var(--rule-w) solid var(--line); }
.faq details { border-bottom: var(--rule-w) solid var(--line); }
.faq summary {
  cursor: pointer;
  padding: var(--row-pad) 0;
  font-family: var(--font-display);
  font-size: var(--fs-1);
  list-style: none;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; float: right; color: var(--ink-faint); }
.faq details[open] summary::after { content: "\2013"; }
.faq p { padding-bottom: var(--row-pad); color: var(--ink-muted); font-size: var(--fs--1); max-width: 62ch; }

/* 08 · Data table --------------------------------------------------------- */
.table-wrap { overflow-x: auto; border: var(--rule-w) solid var(--line); border-radius: var(--r-md); }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs--1);
  background: var(--surface-raised);
}
.table caption {
  caption-side: top;
  text-align: left;
  padding: var(--s-3) var(--s-4);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-subtle);
}
.table th,
.table td {
  padding: var(--row-pad) var(--s-4);
  text-align: left;
  vertical-align: top;
  border-bottom: var(--rule-w) solid var(--line);
}
.table thead th {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-subtle);
  font-weight: var(--weight-semibold);
  background: var(--surface-sunken);
  position: sticky;
  top: 0;
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--surface-sunken); }
.table .col-num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table .col-strong { color: var(--ink); font-weight: var(--weight-medium); }

/* 09 · Stats -------------------------------------------------------------- */
.stats {
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  gap: var(--s-5);
}
.stat { display: flex; flex-direction: column; gap: var(--s-1); }
.stat__value {
  font-family: var(--font-display);
  font-size: var(--fs-3);
  line-height: 1;
  letter-spacing: var(--tracking-tight);
}
.stat__label {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-subtle);
}
.stat__note { font-size: var(--fs--1); color: var(--ink-muted); }

/* 10 · Timeline ----------------------------------------------------------- */
.timeline { list-style: none; position: relative; }
.timeline::before {
  content: "";
  position: absolute;
  inset-block: 0;
  left: 7px;
  width: var(--rule-w);
  background: var(--line);
}
.timeline > li {
  position: relative;
  padding-left: var(--s-6);
  padding-bottom: var(--block-gap);
}
.timeline > li:last-child { padding-bottom: 0; }
.timeline > li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 6px;
  width: 15px;
  height: 15px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 2px solid var(--accent);
}
.timeline__day {
  font-family: var(--font-mono);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.timeline__title {
  font-family: var(--font-display);
  font-size: var(--fs-2);
  line-height: var(--lh-snug);
  margin-top: var(--s-1);
}
.timeline__text { color: var(--ink-muted); font-size: var(--fs--1); margin-top: var(--s-2); max-width: 60ch; }

/* 11 · Chips & badges ----------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); list-style: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  border: var(--rule-w) solid var(--line-strong);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  color: var(--ink-muted);
  background: var(--surface-raised);
  white-space: nowrap;
}
.chip--accent { border-color: var(--accent); color: var(--accent-deep); background: var(--surface-accent-soft); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: var(--r-sm);
  font-size: var(--fs--2);
  font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  background: var(--surface-sunken);
  color: var(--ink-muted);
}
.badge--positive { background: color-mix(in srgb, var(--positive) 14%, transparent); color: var(--positive); }
.badge--warning { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
.badge--negative { background: color-mix(in srgb, var(--negative) 14%, transparent); color: var(--negative); }

/* 12 · Figures ------------------------------------------------------------ */
.figure { margin: 0; display: flex; flex-direction: column; gap: var(--s-2); }
.figure img { border-radius: var(--r-md); width: 100%; object-fit: cover; }
.figure__cap {
  font-size: var(--fs--1);
  color: var(--ink-subtle);
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
}
.figure__cap cite { font-style: normal; color: var(--ink-faint); white-space: nowrap; }

/* 13 · Callout & quote ---------------------------------------------------- */
.callout {
  display: grid;
  gap: var(--s-2);
  padding: var(--card-pad);
  border-radius: var(--r-md);
  background: var(--surface-raised);
  border: var(--rule-w) solid var(--line);
  border-left: 3px solid var(--accent);
}
.callout__title {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--accent-deep);
  font-weight: var(--weight-semibold);
}
.callout--warning { border-left-color: var(--warning); }
.callout--warning .callout__title { color: var(--warning); }
.callout p { color: var(--ink-muted); font-size: var(--fs--1); }

.quote {
  margin: 0;
  padding-block: var(--s-7);
  border-block: var(--rule-w) solid var(--line);
  display: grid;
  gap: var(--s-4);
  place-items: center;
  text-align: center;
}
.quote blockquote {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-2);
  line-height: var(--lh-snug);
  max-width: 40ch;
  text-wrap: balance;
}
.quote figcaption {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-subtle);
}

/* 14 · Buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: 10px 18px;
  border-radius: var(--r-pill);
  border: var(--rule-w) solid transparent;
  background: var(--accent);
  color: var(--ink-on-accent);
  font-size: var(--fs--1);
  font-weight: var(--weight-semibold);
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease), box-shadow var(--dur-2) var(--ease);
  justify-self: start;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-1); }
.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-strong);
}
.btn--ghost:hover { border-color: var(--ink); box-shadow: none; }

/* 15 · TOC ---------------------------------------------------------------- */
.toc { display: grid; gap: var(--s-2); list-style: none; position: sticky; top: calc(var(--nav-h) + 24px); }
.toc a {
  text-decoration: none;
  font-size: var(--fs--1);
  color: var(--ink-subtle);
  display: flex;
  gap: var(--s-3);
  padding-block: 4px;
  border-left: 2px solid transparent;
  padding-left: var(--s-3);
}
.toc a:hover, .toc a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); }
.toc__n { font-family: var(--font-mono); color: var(--ink-faint); }

/* 16 · Footer ------------------------------------------------------------- */
.footer {
  padding-block: var(--s-8) var(--s-6);
  border-top: var(--rule-w) solid var(--line);
  background: var(--surface-sunken);
  font-size: var(--fs--1);
  color: var(--ink-subtle);
}
.footer__grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr));
  gap: var(--block-gap);
}
.footer__title { font-family: var(--font-display); font-size: var(--fs-2); color: var(--ink); }
/* The mark and the wordmark are one lockup: mark at the cap height of the name. */
.footer__title { display: flex; align-items: center; gap: .42em; }
.footer__mark { display: block; width: .92em; height: .92em; object-fit: contain; flex: 0 0 auto; }
.footer__list { list-style: none; display: grid; gap: 6px; }
/* A footer entry that goes somewhere: one hairline, no decoration, and the
   copper underline arrives on hover. */
.footer__list a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 1px;
  transition: color .2s ease, border-color .2s ease;
}
.footer__list a:hover,
.footer__list a:focus-visible { color: var(--ink); border-bottom-color: var(--highlight); outline: none; }
.footer__base {
  margin-top: var(--s-7);
  padding-top: var(--s-4);
  border-top: var(--rule-w) solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
  flex-wrap: wrap;
  font-size: var(--fs--2);
  color: var(--ink-faint);
}

/* 16b · Forms · icons · crumbs · pager · tabs · meters · modal · toast ---- */
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }

/* Forms, one field component, three states. */
.form { display: grid; gap: var(--s-4); max-width: 520px; }
.form--row { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; max-width: none; }
.field { display: grid; gap: 6px; }
.field__label {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-subtle);
  font-weight: var(--weight-semibold);
}
.field__hint { font-size: var(--fs--2); color: var(--ink-faint); }
.field__error { font-size: var(--fs--2); color: var(--negative); display: flex; gap: 4px; align-items: center; }

.input,
.textarea,
.select {
  width: 100%;
  font: inherit;
  font-size: var(--fs--1);
  color: var(--ink);
  background: var(--surface-raised);
  border: var(--rule-w) solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  transition: border-color var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast) var(--motion-ease);
}
.textarea { min-height: 120px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--ink-faint); }
.input:hover, .textarea:hover, .select:hover { border-color: var(--ink-faint); }
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-quiet);
}
.field.is-invalid .input,
.field.is-invalid .textarea { border-color: var(--negative); }

.check { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs--1); color: var(--ink-muted); }
.check input { accent-color: var(--accent); margin-top: 3px; }

.range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  background: transparent;
  cursor: pointer;
}
.range::-webkit-slider-runnable-track { height: 4px; border-radius: var(--r-pill); background: var(--line-strong); }
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface-raised);
}
.range::-moz-range-track { height: 4px; border-radius: var(--r-pill); background: var(--line-strong); }
.range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 2px solid var(--surface-raised);
  border-radius: 50%;
  background: var(--accent);
}
.range:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: var(--rule-w) solid var(--line-strong);
  border-radius: var(--r-pill);
  padding: 6px 14px;
  background: var(--surface-raised);
  max-width: 320px;
}
.search input { border: 0; background: transparent; font: inherit; color: inherit; width: 100%; outline: none; }
.search .icon { color: var(--ink-faint); }

/* Breadcrumbs, required the moment a site has more than one level. */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; list-style: none; font-size: var(--fs--2); color: var(--ink-faint); }
.crumbs li { display: flex; gap: 6px; align-items: center; }
.crumbs li + li::before { content: "/"; color: var(--line-strong); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs [aria-current="page"] { color: var(--ink-muted); }

/* Pagination */
.pager { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; align-items: center; }
.pager a, .pager span {
  min-width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-sm);
  text-decoration: none;
  font-size: var(--fs--1);
  color: var(--ink-muted);
}
.pager a:hover { border-color: var(--ink); color: var(--ink); }
.pager [aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--ink-on-accent); }
.pager .is-disabled { opacity: .4; pointer-events: none; }

/* Tabs */
.tabs__list {
  display: flex;
  gap: 4px;
  border-bottom: var(--rule-w) solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs__list::-webkit-scrollbar { display: none; }
.tabs__list button {
  border: 0;
  background: transparent;
  padding: 10px 14px;
  font-size: var(--fs--1);
  color: var(--ink-subtle);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tabs__list button:hover { color: var(--ink); }
.tabs__list button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs__panel { padding-top: var(--s-5); }
.tabs__panel[hidden] { display: none; }

/* Meters & ratings */
.meter { display: grid; gap: 6px; }
.meter__track { height: 8px; border-radius: var(--r-pill); background: var(--surface-sunken); overflow: hidden; }
.meter__fill { height: 100%; width: var(--v, 0%); background: var(--accent); border-radius: inherit; transition: width var(--motion-slow) var(--motion-ease-out); }
.meter__row { display: flex; justify-content: space-between; font-size: var(--fs--2); color: var(--ink-subtle); }

.rating { display: inline-flex; gap: 2px; color: var(--highlight); }
.rating .icon { width: 14px; height: 14px; }
.rating .is-empty { color: var(--line-strong); }

/* Modal, native dialog, so focus trapping and Escape come free. */
.modal {
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-raised);
  color: var(--ink);
  padding: var(--s-6);
  max-width: 460px;
  width: calc(100% - 32px);
  box-shadow: var(--shadow-2);
}
.modal::backdrop { background: rgba(10, 10, 10, 0.55); backdrop-filter: blur(2px); }
.modal__head { display: flex; justify-content: space-between; gap: var(--s-4); align-items: flex-start; }
.modal__title { font-family: var(--font-display); font-size: var(--fs-2); line-height: var(--lh-snug); }
.modal__body { margin-top: var(--s-3); color: var(--ink-muted); font-size: var(--fs--1); }
.modal__actions { margin-top: var(--s-5); display: flex; gap: var(--s-3); justify-content: flex-end; }
.modal__x { border: 0; background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 18px; line-height: 1; }

/* Toast, transient confirmation, never the only signal for an error. */
.toast-stack {
  position: fixed;
  right: 20px;
  bottom: 72px;   /* clears the back-to-top button */
  z-index: 70;
  display: grid;
  gap: 8px;
  justify-items: end;
  /* The stack must never eat a click meant for the page underneath it. */
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 14px;
  border-radius: var(--r-sm);
  border: var(--rule-w) solid var(--line-strong);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  font-size: var(--fs--1);
  box-shadow: var(--shadow-2);
  animation: toast-in var(--motion-base) var(--motion-ease-out) both;
}
.toast--positive { border-left: 3px solid var(--positive); }
.toast--negative { border-left: 3px solid var(--negative); }
.toast.is-leaving { animation: toast-out var(--motion-base) var(--motion-ease) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }

/* Back to top */
.to-top {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 50;
  width: 40px;
  height: 40px;
  border-radius: var(--r-pill);
  border: var(--rule-w) solid var(--line-strong);
  background: var(--surface-raised);
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity var(--motion-base) var(--motion-ease), transform var(--motion-base) var(--motion-ease);
}
.to-top.is-visible { opacity: 1; transform: none; pointer-events: auto; }
.to-top:hover { border-color: var(--accent); color: var(--accent); }

/* Code */
.code {
  display: block;
  overflow-x: auto;
  padding: var(--s-4);
  border-radius: var(--r-sm);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  font-family: var(--font-mono);
  font-size: var(--fs--1);
  line-height: 1.6;
  white-space: pre;
}
.code--inline {
  display: inline;
  padding: 1px 6px;
  font-size: 0.92em;
  white-space: normal;
}

/* 16c · Media, disclosure, comparison, chrome ----------------------------- */

/* Lightbox, the figure is the trigger; native dialog does the rest. */
.figure--zoom {
  border: 0;
  padding: 0;
  background: none;
  text-align: left;
  cursor: zoom-in;
  display: grid;
  gap: var(--s-2);
}
.figure--zoom img { transition: transform var(--motion-slow) var(--motion-ease-out); }
.figure--zoom:hover img { transform: scale(1.015); }

.lightbox {
  border: 0;
  padding: 0;
  background: transparent;
  max-width: min(1100px, 94vw);
  width: 100%;
}
.lightbox::backdrop { background: rgba(8, 8, 8, 0.86); }
.lightbox figure { margin: 0; display: grid; gap: 10px; }
.lightbox img { width: 100%; max-height: 78vh; object-fit: contain; border-radius: var(--r-sm); }
.lightbox figcaption {
  color: #e8e8e8;
  font-size: var(--fs--1);
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
}
.lightbox figcaption cite { font-style: normal; color: #9a9a9a; }
.lightbox__x,
.lightbox__nav {
  position: fixed;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background: rgba(20, 20, 20, 0.7);
  color: #fff;
  border-radius: var(--r-pill);
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.lightbox__x { top: 20px; right: 20px; }
.lightbox__nav { top: 50%; transform: translateY(-50%); }
.lightbox__nav--prev { left: 16px; }
.lightbox__nav--next { right: 16px; }

/* Accordion, disclosure with real content, not a Q/A string. */
.accordion { border-top: var(--rule-w) solid var(--line); }
.accordion details { border-bottom: var(--rule-w) solid var(--line); }
.accordion summary {
  cursor: pointer;
  list-style: none;
  padding: var(--row-pad) 0;
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
  align-items: baseline;
  font-family: var(--font-display);
  font-size: var(--fs-1);
}
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary::after {
  content: "+";
  color: var(--ink-faint);
  font-family: var(--font-text);
  flex: none;
}
.accordion details[open] summary::after { content: "\2013"; }
.accordion__body { padding: 0 0 var(--block-gap); display: grid; gap: var(--s-3); max-width: 66ch; }
.accordion__body p { color: var(--ink-muted); font-size: var(--fs--1); }

/* The questions sit as one column in the middle of the page — stacked, not
   beside the heading — and the heading still reads from the left. */
.faq-block { max-width: 680px; margin-inline: auto; }
.faq-block .accordion { margin-top: var(--s-7); }

/* Comparison matrix, frozen first column, tick/cross cells. */
.table--compare th:first-child,
.table--compare td:first-child {
  position: sticky;
  left: 0;
  background: var(--surface-raised);
  z-index: 2;
  box-shadow: 1px 0 0 var(--line);
}
.table--compare thead th:first-child { background: var(--surface-sunken); z-index: 3; }
.table--compare td { text-align: center; }
.table--compare td:first-child { text-align: left; }
.table--compare .yes { color: var(--positive); }
.table--compare .no { color: var(--ink-faint); }

/* Logo ticker, duplicated track, paused for reduced motion. */
.ticker {
  overflow: hidden;
  border-block: var(--rule-w) solid var(--line);
  padding-block: var(--s-4);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.ticker__track {
  display: flex;
  gap: var(--s-8);
  width: max-content;
  animation: ticker 28s linear infinite;
  font-family: var(--font-display);
  font-size: var(--fs-1);
  color: var(--ink-subtle);
  white-space: nowrap;
}
.ticker:hover .ticker__track { animation-play-state: paused; }
@keyframes ticker { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  .ticker__track { animation: none; }
  .ticker { overflow-x: auto; }
}

/* Avatar group */
.avatars { display: flex; align-items: center; }
.avatars img,
.avatars .avatars__more {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--surface-raised);
  object-fit: cover;
  margin-left: -8px;
  background: var(--surface-sunken);
}
.avatars > :first-child { margin-left: 0; }
.avatars__more {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs--2);
  font-weight: var(--weight-semibold);
  color: var(--ink-subtle);
}

/* Stat with a direction and a sparkline */
.stat__trend { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs--2); }
.stat__trend--up { color: var(--positive); }
.stat__trend--down { color: var(--negative); }
.spark { display: block; }
.spark path { fill: none; stroke: currentColor; stroke-width: 1.6; }

/* Tooltip, CSS only, on hover and focus. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%) translateY(4px);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-normal);
  text-transform: none;
  padding: 5px 9px;
  border-radius: var(--r-sm);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-fast) var(--motion-ease), transform var(--motion-fast) var(--motion-ease);
  z-index: 30;
}
[data-tip]:hover::after,
[data-tip]:focus-visible::after { opacity: 1; transform: translateX(-50%); }

/* Segmented control, a filter, not a tab. */
.segmented {
  display: inline-flex;
  justify-self: start;
  padding: 3px;
  gap: 3px;
  border: var(--rule-w) solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--surface-sunken);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.segmented::-webkit-scrollbar { display: none; }
.segmented button {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: var(--r-pill);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-subtle);
  cursor: pointer;
}
.segmented button[aria-pressed="true"] {
  background: var(--surface-raised);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}

/* Announcement bar */
.announce {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: 10px var(--gutter);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  font-size: var(--fs--1);
}
.announce a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.announce__x {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: inherit;
  opacity: 0.6;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  padding: 4px;
}
.announce__x:hover { opacity: 1; }

/* 16d · Carousel, people, lists, loading, states, mobile chrome ----------- */

/* Carousel, scroll-snap, no library. Arrows are a hint, not the only way. */
.carousel { position: relative; }
.carousel__track {
  display: flex;
  gap: var(--s-4);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  padding-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}
.carousel__track::-webkit-scrollbar { display: none; }
.carousel__item { flex: 0 0 min(400px, 84%); scroll-snap-align: start; }
.carousel__nav {
  position: absolute;
  top: 38%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border-radius: var(--r-pill);
  border: var(--rule-w) solid var(--line-strong);
  background: var(--surface-raised);
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-1);
}
.carousel__nav:disabled { opacity: 0.35; pointer-events: none; }
.carousel__nav--prev { left: -14px; }
.carousel__nav--next { right: -14px; }
.carousel__dots { display: flex; gap: 6px; justify-content: center; margin-top: var(--s-4); }
.carousel__dots button {
  width: 8px;
  height: 8px;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--line-strong);
  cursor: pointer;
  padding: 0;
  transition: width var(--motion-base) var(--motion-ease), background var(--motion-fast) linear;
}
.carousel__dots button[aria-current="true"] { width: 22px; background: var(--accent); }
@media (hover: none) { .carousel__nav { display: none; } }

/* People */
.team { display: grid; gap: var(--block-gap); grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
.person img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--r-md); background: var(--surface-sunken); }
.person__name { font-family: var(--font-display); font-size: var(--fs-1); margin-top: var(--s-3); }
.person__role {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 2px;
}
.person__note { font-size: var(--fs--1); color: var(--ink-subtle); margin-top: var(--s-2); }

/* Article list, date, title, excerpt. The blog row that every site needs. */
.articles { border-top: var(--rule-w) solid var(--line); }
.articles a {
  display: grid;
  grid-template-columns: 116px minmax(0, 1fr) auto;
  gap: var(--s-4);
  align-items: baseline;
  padding: var(--row-pad) 0;
  border-bottom: var(--rule-w) solid var(--line);
  text-decoration: none;
}
.articles time { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); }
.articles h3 { font-family: var(--font-display); font-size: var(--fs-1); line-height: var(--lh-snug); }
.articles p { color: var(--ink-subtle); font-size: var(--fs--1); margin-top: 4px; max-width: 62ch; }
.articles a:hover h3 { color: var(--accent); }
@media (max-width: 680px) {
  .articles a { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

/* Countdown */
.countdown { display: flex; gap: var(--s-5); flex-wrap: wrap; }
.countdown__unit { display: grid; gap: 2px; }
.countdown__n {
  font-family: var(--font-display);
  font-size: var(--fs-3);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.countdown__l {
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* Loading, skeletons match the shape of what is coming, not a spinner. */
.skeleton {
  display: block;
  height: 0.9em;
  border-radius: var(--r-sm);
  background: linear-gradient(
    90deg,
    var(--surface-sunken) 25%,
    var(--surface-raised) 37%,
    var(--surface-sunken) 63%
  );
  background-size: 400% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}
.skeleton--card { height: 190px; border-radius: var(--r-md); }
.skeleton--title { height: 1.4em; width: 60%; }
.skeleton--short { width: 40%; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

/* Empty state */
.empty-state {
  display: grid;
  gap: var(--s-2);
  place-items: center;
  text-align: center;
  padding: var(--s-8) var(--s-5);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-md);
  color: var(--ink-subtle);
}
.empty-state strong { color: var(--ink); font-family: var(--font-display); font-size: var(--fs-1); }

/* Sticky mobile CTA, the action that must never scroll away. */
.sticky-cta {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 45;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  padding: 10px var(--gutter);
  background: var(--surface-raised);
  border-top: var(--rule-w) solid var(--line);
  box-shadow: 0 -8px 24px -18px rgba(0, 0, 0, 0.5);
}
.sticky-cta__text { font-size: var(--fs--2); color: var(--ink-subtle); }
.sticky-cta__text strong { display: block; color: var(--ink); font-size: var(--fs--1); }
@media (max-width: 860px) { .sticky-cta { display: flex; } }

/* Section rail, secondary nav for a long document. */
.rail {
  position: sticky;
  top: calc(var(--nav-h) + 16px);
  display: grid;
  gap: 1px;
  font-size: var(--fs--1);
  align-self: start;
}
.rail a {
  text-decoration: none;
  color: var(--ink-subtle);
  padding: 5px 0 5px var(--s-3);
  border-left: 2px solid transparent;
}
.rail a:hover { color: var(--ink); }
.rail a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); }
@media (max-width: 1000px) { .rail { display: none; } }

/* 16e · Nav variants & dashboard shell ------------------------------------ */

/* Utility strip above the main bar */
.utility {
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
  flex-wrap: wrap;
  padding: 6px var(--gutter);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
}
.utility a { color: inherit; text-decoration: none; opacity: .8; }
.utility a:hover { opacity: 1; }

/* A nav with no rule and no blur, sits on the hero */
.nav--minimal {
  position: absolute;
  left: 0;
  right: 0;
  background: transparent;
  backdrop-filter: none;
  border-bottom: 0;
}

/* Application bar: workspace, global search, actions */
.nav--app { gap: var(--s-4); }
/* The search used to collapse to a sliver once a picker and a timestamp were
   present. It keeps a floor and the least important item drops first. */
.nav--app .nav__search { min-width: 160px; flex: 1 1 200px; }
@media (max-width: 1240px) {
  .nav--app .nav__actions > .caps { display: none; }
}
@media (max-width: 860px) {
  .nav--app .nav__search { display: none; }
}
.nav__workspace {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs--1);
  font-weight: var(--weight-medium);
  white-space: nowrap;
}
.nav__workspace span { color: var(--ink-faint); font-weight: var(--weight-body); }
.nav__search {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 420px;
  padding: 6px 12px;
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface-sunken);
  color: var(--ink-faint);
  font-size: var(--fs--1);
}
.nav__search input { border: 0; background: transparent; font: inherit; color: var(--ink); width: 100%; outline: none; }
.nav__actions { display: flex; align-items: center; gap: var(--s-2); }

/* App shell: fixed rail + scrolling main */
.app-shell {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: 100vh;
  transition: grid-template-columns var(--motion-base) var(--motion-ease);
}
.app-shell.is-collapsed { grid-template-columns: 68px minmax(0, 1fr); }

.app-side {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  border-right: var(--rule-w) solid var(--line);
  background: var(--surface-raised);
  overflow: hidden;
}
.app-side__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: var(--rule-w) solid var(--line);
  font-family: var(--font-display);
  font-size: var(--fs-1);
  white-space: nowrap;
}
.app-side__toggle {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 4px;
  border-radius: var(--r-sm);
}
.app-side__toggle:hover { color: var(--ink); background: var(--surface-sunken); }

.app-nav { display: grid; gap: 1px; padding: 10px; align-content: start; overflow-y: auto; }
.app-nav__group {
  padding: 12px 10px 5px;
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.app-nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  text-decoration: none;
  color: var(--ink-muted);
  font-size: var(--fs--1);
  white-space: nowrap;
}
.app-nav a:hover { background: var(--surface-sunken); color: var(--ink); }
/* The router sets aria-current="true"; hand-authored shells say "page". Both
   are the current view and both get the same treatment. */
.app-nav a[aria-current], .app-nav a[aria-current="page"] { background: var(--accent-quiet); color: var(--accent-deep); font-weight: var(--weight-medium); }
.app-nav .icon { flex: none; }
.app-side__foot { margin-top: auto; padding: 10px; border-top: var(--rule-w) solid var(--line); }

/* Collapsed rail: labels out, icons stay. The icon lives inside a
   span[data-icon], so the rule must target the label span specifically ,
   hiding every span blanked the rail entirely. */
.app-shell.is-collapsed .app-side__brand span,
.app-shell.is-collapsed .app-nav__group,
.app-shell.is-collapsed .app-nav a > span:not([data-icon]),
.app-shell.is-collapsed .app-side__foot span { display: none; }
.app-shell.is-collapsed .app-nav a { justify-content: center; padding: 10px 0; }

.app-main {
  display: grid;
  /* An implicit auto column is sized by max-content, so a long top bar could
     push the whole shell wider than the viewport. Pin it to the track. */
  grid-template-columns: minmax(0, 1fr);
  align-content: start;
  min-width: 0;
}
.app-topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s-4);
  row-gap: 6px;
  padding: 10px 24px;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: var(--rule-w) solid var(--line);
  min-height: 56px;
}
.app-topbar__title { font-family: var(--font-display); font-size: var(--fs-1); white-space: nowrap; }
.app-topbar__crumbs { font-size: var(--fs--2); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .app-topbar__crumbs { display: none; } }
.app-content { padding: 22px 24px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-5); }
.app-grid { display: grid; gap: var(--s-5); grid-template-columns: repeat(12, minmax(0, 1fr)); }
@media (max-width: 1100px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
/* Two-region app layout. Explicit columns instead of span-8/span-4, which
   silently created implicit tracks once the grid dropped to six columns. */
.app-cols { display: grid; gap: var(--s-5); grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); align-items: start; }
.app-cols--even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* List + inspector. The inspector column has a floor so a table does not win
   the width fight, and both regions stack below 1000px. */
.app-cols--side { grid-template-columns: minmax(0, 1fr) 380px; }
/* A sticky inspector is right beside a list and wrong once the layout stacks. */
.pane { position: sticky; top: 76px; align-self: start; }
@media (max-width: 1000px) {
  .app-cols, .app-cols--even, .app-cols--side { grid-template-columns: minmax(0, 1fr); }
  .pane { position: static; top: auto; }
}
@media (max-width: 900px) {
  .app-shell, .app-shell.is-collapsed { grid-template-columns: minmax(0, 1fr); }
  .app-side { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; }
  .app-nav { grid-auto-flow: column; }
  .app-shell.is-collapsed .app-side__brand span,
  .app-shell.is-collapsed .app-nav a span { display: inline; }
}

/* KPI tiles */
.kpis { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi {
  display: grid;
  gap: 6px;
  padding: 16px;
  background: var(--surface-raised);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
}
.kpi__label { font-size: var(--fs--2); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-faint); }
.kpi__value {
  font-family: var(--font-display);
  font-size: var(--fs-3);
  line-height: 1;
  letter-spacing: var(--tracking-tight);
  /* Currency strings wrap their sign onto a second line in a narrow tile. */
  white-space: nowrap;
}
.kpi__foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: var(--fs--2); color: var(--ink-subtle); }

/* Panel, the dashboard workhorse */
.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--surface-raised);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
}
.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  padding: 13px 16px;
  border-bottom: var(--rule-w) solid var(--line);
  flex-wrap: wrap;
}
.panel__tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 100%; }
.panel__title { font-size: var(--fs--1); font-weight: var(--weight-semibold); }
.panel__body { padding: 16px; min-width: 0; }
.panel__body--flush { padding: 0; }
.panel__foot { padding: 10px 16px; border-top: var(--rule-w) solid var(--line); font-size: var(--fs--2); color: var(--ink-faint); }

/* Status dot */
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-subtle);
  white-space: nowrap;
}
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.status--running { color: var(--positive); }
.status--idle { color: var(--ink-faint); }
.status--failed { color: var(--negative); }
.status--warn { color: var(--warning); }

/* Switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: var(--fs--1); }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch__track {
  width: 38px;
  height: 22px;
  border-radius: var(--r-pill);
  background: var(--line-strong);
  position: relative;
  flex: none;
  transition: background var(--motion-fast) linear;
}
.switch__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform var(--motion-fast) var(--motion-ease);
}
.switch input:checked + .switch__track { background: var(--accent); }
.switch input:checked + .switch__track::after { transform: translateX(16px); }
.switch input:focus-visible + .switch__track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Progress ring */
.ring { position: relative; display: grid; place-items: center; width: var(--size, 96px); height: var(--size, 96px); }
.ring svg { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .ring__track { stroke: var(--line); }
.ring .ring__value { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset var(--motion-slow) var(--motion-ease-out); }
.ring__label { position: absolute; font-family: var(--font-display); font-size: var(--fs-1); }

/* Activity feed */
.feed { display: grid; }
.feed__item {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 0;
  border-bottom: var(--rule-w) solid var(--line);
}
.feed__item:last-child { border-bottom: 0; }
.feed__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; }
.feed__dot--warn { background: var(--warning); }
.feed__dot--bad { background: var(--negative); }
.feed__text { font-size: var(--fs--1); color: var(--ink-muted); }
.feed__text strong { color: var(--ink); font-weight: var(--weight-medium); }
.feed time { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); white-space: nowrap; }

/* Toolbar above a data table */
.toolbar {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-wrap: wrap;
  padding: 10px 14px;
  border-bottom: var(--rule-w) solid var(--line);
}
.toolbar__count { font-size: var(--fs--2); color: var(--ink-faint); margin-left: auto; }
.table--compact th, .table--compact td { padding: 7px 12px; }
.table[data-sortable] thead th { cursor: pointer; user-select: none; }
.table th[aria-sort="ascending"]::after { content: " \2191"; color: var(--accent); }
.table th[aria-sort="descending"]::after { content: " \2193"; color: var(--accent); }

/* Style picker, part of the system so pages do not each invent one. */
.style-select {
  font: inherit;
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  padding: 6px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface-raised);
  color: var(--ink-muted);
  max-width: 150px;
}

/* Split view: a record list beside a detail pane. The other dashboard shape. */
.split-view {
  display: grid;
  gap: var(--s-4);
  grid-template-columns: minmax(0, 1fr) 340px;
  align-items: start;
}
.split-view__side { position: sticky; top: calc(var(--nav-h) + 16px); }
@media (max-width: 860px) {
  .split-view { grid-template-columns: minmax(0, 1fr); }
  .split-view__side { position: static; }
}

/* 16e2 · Structural layouts ----------------------------------------------- */
/* Not components: page shapes. A template picks one and the page stops looking
   like every other template wearing a different skin. */

/* Masthead, a publication's front matter, not a nav bar. */
.masthead {
  padding-block: var(--s-5) var(--s-4);
  border-bottom: var(--rule-w) solid var(--line-strong);
}
.masthead__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-4);
  flex-wrap: wrap;
}
.masthead__mark {
  font-family: var(--font-display);
  font-size: var(--fs-2);
  letter-spacing: var(--tracking-tight);
  text-decoration: none;
  color: var(--ink);
}
.masthead__meta {
  display: flex;
  gap: var(--s-4);
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.masthead__rule {
  display: flex;
  justify-content: space-between;
  gap: var(--s-4);
  flex-wrap: wrap;
  margin-top: var(--s-3);
  padding-top: var(--s-2);
  border-top: var(--rule-w) solid var(--line);
  font-size: var(--fs--2);
  color: var(--ink-faint);
}

/* Poster, one screen, type first, chrome at the corners. */
.poster {
  position: relative;
  min-height: 100svh;
  display: grid;
  align-content: space-between;
  padding: var(--s-5) var(--gutter) var(--s-6);
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  isolation: isolate;
  overflow: hidden;
}
.poster::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    repeating-linear-gradient(90deg, transparent 0 78px, var(--line-inverse) 78px 79px),
    repeating-linear-gradient(0deg, transparent 0 78px, var(--line-inverse) 78px 79px);
  opacity: .5;
}
.poster--light { background: var(--surface); color: var(--ink); }
.poster--light::before { background-image: repeating-linear-gradient(90deg, transparent 0 78px, var(--line) 78px 79px), repeating-linear-gradient(0deg, transparent 0 78px, var(--line) 78px 79px); }
.poster__top { display: flex; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--fs--2); letter-spacing: var(--tracking-wide); text-transform: uppercase; opacity: .8; }
.poster__mid { display: grid; gap: var(--s-5); padding-block: var(--s-7); }
.poster__title {
  font-family: var(--font-display);
  font-size: var(--fs-6);
  line-height: .88;
  letter-spacing: var(--tracking-display);
  text-wrap: balance;
  max-width: 18ch;
}
.poster__lede { font-size: var(--fs-1); max-width: 42ch; opacity: .85; line-height: var(--lh-snug); }
.poster__foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-5); align-items: end; }
@media (max-width: 780px) { .poster__foot { grid-template-columns: minmax(0, 1fr); } .poster__title { font-size: var(--fs-5); } }

/* Showcase, a sticky index beside a scrolling body. */
.showcase {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: var(--gutter);
  align-items: start;
}
.showcase__rail { position: sticky; top: calc(var(--nav-h) + 24px); display: grid; gap: var(--s-3); }
.showcase__label { font-size: var(--fs--2); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-faint); }
.showcase__main { display: grid; gap: var(--s-6); }
@media (max-width: 900px) { .showcase { grid-template-columns: minmax(0, 1fr); } .showcase__rail { position: static; } }

/* Work rows, the index-list alternative to a card grid. */
.workrow {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: var(--s-4);
  align-items: baseline;
  padding-block: var(--s-5);
  border-top: var(--rule-w) solid var(--line);
  text-decoration: none;
  color: inherit;
  transition: background var(--dur-2) var(--ease), padding-inline var(--dur-2) var(--ease);
}
.workrow:last-child { border-bottom: var(--rule-w) solid var(--line); }
.workrow:hover { background: var(--surface-sunken); padding-inline: var(--s-3); }
.workrow__n { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); }
.workrow__title {
  font-family: var(--font-display);
  font-size: var(--fs-3);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
}
.workrow__sub { color: var(--ink-subtle); font-size: var(--fs--1); margin-top: var(--s-2); max-width: 52ch; }
.workrow__meta { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); text-align: right; white-space: nowrap; }
@media (max-width: 680px) {
  .workrow { grid-template-columns: 40px minmax(0, 1fr); }
  .workrow__meta { grid-column: 2; text-align: left; }
  .workrow__title { font-size: var(--fs-2); }
}

/* Doc layout, a persistent rail beside a reading column. */
.doc-layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: var(--gutter);
  align-items: start;
  padding-block: var(--s-7);
}
.doc-rail { position: sticky; top: calc(var(--nav-h) + 24px); display: grid; gap: var(--s-2); }
.doc-rail a {
  text-decoration: none;
  font-size: var(--fs--1);
  color: var(--ink-subtle);
  padding: 5px 0 5px var(--s-3);
  border-left: 2px solid transparent;
}
.doc-rail a:hover, .doc-rail a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); }
.doc-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-6); max-width: 68ch; }
.doc-body > p { font-size: var(--fs-0); line-height: var(--lh-text); color: var(--ink-muted); }
@media (max-width: 900px) { .doc-layout { grid-template-columns: minmax(0, 1fr); } .doc-rail { position: static; display: flex; flex-wrap: wrap; } }

/* Band, full-bleed interruption. Breaks the gutter on purpose. */
.band {
  padding-block: var(--s-9);
  background: var(--surface-sunken);
  border-block: var(--rule-w) solid var(--line);
}
.band--inverse { background: var(--surface-inverse); color: var(--ink-inverse); border-color: var(--line-inverse); }
.band--accent { background: var(--surface-accent); color: var(--ink-on-accent); border-color: transparent; }
.band__title {
  font-family: var(--font-display);
  font-size: var(--fs-4);
  line-height: .98;
  letter-spacing: var(--tracking-display);
  max-width: 24ch;
  text-wrap: balance;
}
.band__row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: var(--gutter); align-items: end; }
/* A slide, drawn at the head of the download stack, centred over the button so
   the pair read as one object. */
.reserve-stack { display: grid; justify-items: center; gap: var(--s-4); }
.reserve-ico { display: block; width: 48px; height: 48px; color: var(--ink-on-accent); opacity: .9; }
.reserve-ico svg { display: block; width: 100%; height: 100%; }
@media (max-width: 900px) { .band__row { grid-template-columns: minmax(0, 1fr); } }

/* Colour-panel hero: no photography, pure type and blocks. */
.hero--panel {
  position: relative;
  overflow: hidden;
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  min-height: min(88vh, 760px);
  display: grid;
  align-content: end;
}
.hero--panel::before {
  content: "";
  position: absolute;
  inset: auto -8% -30% 55%;
  width: 60vw;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--accent);
  opacity: .28;
  filter: blur(2px);
}
.hero--panel::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(115deg, transparent 0 120px, var(--line-inverse) 120px 121px);
  opacity: .22;
  pointer-events: none;
}
.hero--panel .wrap { position: relative; z-index: 1; }
@media (max-width: 780px) { .hero--panel { min-height: 78svh; } }

/* Sticky decision bar, for comparison pages that must keep the numbers. */
.decision-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  flex-wrap: wrap;
  padding: 10px var(--s-4);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: var(--rule-w) solid var(--line);
  font-size: var(--fs--1);
}

/* Comparison rows that expand in place. */
.prop { border: 0; }
.prop > summary { cursor: pointer; list-style: none; }
.prop > summary::-webkit-details-marker { display: none; }
.prop[open] > summary { background: var(--surface-sunken); }
.prop__body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: var(--s-5);
  padding: var(--s-4) var(--s-3) var(--s-6);
  border-bottom: var(--rule-w) solid var(--line);
}
.ticks { list-style: none; display: grid; gap: 6px; font-size: var(--fs--1); color: var(--ink-muted); }
.ticks li::before { content: "+"; color: var(--positive); margin-right: 8px; font-family: var(--font-mono); }
.ticks--cross li::before { content: "\2212"; color: var(--negative); }
@media (max-width: 900px) { .prop__body { grid-template-columns: minmax(0, 1fr); } }

/* Oversized quote, an editorial pause, not a testimonial card. */
.pullquote {
  margin: 0;
  padding-block: var(--s-8);
  border-block: var(--rule-w) solid var(--line);
  display: grid;
  gap: var(--s-4);
}
.pullquote blockquote {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-3);
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
  max-width: 28ch;
  text-wrap: balance;
}
.pullquote figcaption { font-family: var(--font-mono); font-size: var(--fs--2); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-faint); }

/* Two asymmetric splits used by site and product pages. */
.split-6040 { display: grid; gap: var(--gutter); grid-template-columns: minmax(0, 1.35fr) minmax(0, .65fr); align-items: end; }
.split-contact { display: grid; gap: var(--gutter); grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: start; }
@media (max-width: 900px) {
  .split-6040, .split-contact { grid-template-columns: minmax(0, 1fr); }
}

/* Four-step row used by product pages; collapses to two, then one. */
.steps-row { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-5); }
@media (max-width: 900px) { .steps-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .steps-row { grid-template-columns: minmax(0, 1fr); } }

/* Split hero: copy pinned left, panels scroll right. */
.splitposter {
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
  min-height: 100svh;
}
.splitposter__side {
  position: sticky;
  top: 0;
  align-self: start;
  min-height: 100svh;
  display: grid;
  align-content: space-between;
  gap: var(--s-6);
  padding: var(--s-7) var(--s-6);
  border-right: var(--rule-w) solid var(--line);
}
.splitposter__panels { display: grid; }
.splitposter__panel {
  min-height: 62svh;
  padding: var(--s-8) var(--gutter);
  display: grid;
  align-content: end;
  gap: var(--s-3);
  border-bottom: var(--rule-w) solid var(--line);
  background: var(--surface-sunken);
}
.splitposter__panel:nth-child(even) { background: var(--surface-raised); }
@media (max-width: 900px) {
  .splitposter { grid-template-columns: minmax(0, 1fr); }
  .splitposter__side { position: static; min-height: auto; border-right: 0; border-bottom: var(--rule-w) solid var(--line); }
  .splitposter__panel { min-height: 46svh; }
}

/* Shared content blocks rendered by pagekit.js. */
.pk-lead { font-size: var(--fs-1); line-height: var(--lh-snug); color: var(--ink-muted); max-width: 56ch; margin: 0; }
.pk-h2 { font-family: var(--font-display); font-size: var(--fs-2); line-height: var(--lh-snug); margin: var(--s-6) 0 0; letter-spacing: var(--tracking-tight); }
.pk-h3 { font-family: var(--font-display); font-size: var(--fs-1); margin: var(--s-5) 0 0; }
.pk-list { color: var(--ink-muted); line-height: var(--lh-text); padding-left: 1.15em; margin: 0; display: grid; gap: 6px; }
.pk-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: var(--rule-w) solid var(--line); margin: 0; }
.pk-facts > div { background: var(--surface-raised); padding: 10px 12px; }
.pk-facts dt { font-size: var(--fs--2); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-faint); }
.pk-facts dd { margin: 4px 0 0; font-size: var(--fs--1); font-family: var(--font-mono); }

/* App hero, the opening statement of an application view. Bigger than a
   panel, smaller than a marketing hero, and allowed to differ per app. */
.app-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, .6fr);
  gap: var(--s-6);
  align-items: end;
  padding: var(--s-2) 0 var(--s-5);
  border-bottom: var(--rule-w) solid var(--line-strong);
}
.app-hero__kicker { font-size: var(--fs--2); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-faint); margin: 0; }
.app-hero__title {
  font-family: var(--font-display);
  font-size: var(--fs-5);
  line-height: .9;
  letter-spacing: var(--tracking-display);
  margin: 10px 0 0;
  max-width: 18ch;
}
.app-hero__lede { color: var(--ink-subtle); font-size: var(--fs--1); max-width: 52ch; margin: 10px 0 0; line-height: var(--lh-text); }
.app-hero__side { display: flex; gap: var(--s-5); align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.app-hero__stat { display: grid; gap: 2px; }
.app-hero__stat b { font-family: var(--font-display); font-size: var(--fs-3); line-height: 1; letter-spacing: var(--tracking-tight); }
.app-hero__stat span { font-size: var(--fs--2); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--ink-faint); }
@media (max-width: 900px) {
  .app-hero { grid-template-columns: minmax(0, 1fr); gap: var(--s-4); }
  .app-hero__side { justify-content: flex-start; }
  .app-hero__title { font-size: var(--fs-4); }
}

/* 16f · App-kit patterns --------------------------------------------------- */
/* Widgets that only an application shell needs. They are still system
   components: same tokens, same radii, same line weights. */

/* Avatars, initials, deterministic tone, no photography required. */
.avatar {
  width: var(--av, 26px);
  height: var(--av, 26px);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  font-size: calc(var(--av, 26px) * 0.38);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.02em;
  color: #fff;
  background: var(--accent);
  user-select: none;
}
.avatar[data-tone="1"] { background: #7a5c3a; }
.avatar[data-tone="2"] { background: #4a5f7d; }
.avatar[data-tone="3"] { background: #6b4d6e; }
.avatar[data-tone="4"] { background: #4f6b52; }
.avatar[data-tone="5"] { background: #8a5a4a; }
.avatar--ring { box-shadow: 0 0 0 2px var(--surface-raised), 0 0 0 3px var(--line-strong); }
.avatars--sm .avatar { margin-left: -6px; border: 2px solid var(--surface-raised); }
.avatars--sm > :first-child { margin-left: 0; }

/* Kanban, columns of cards. The board scrolls sideways on narrow screens
   instead of collapsing into an unreadable stack. */
.kanban {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(250px, 1fr);
  gap: var(--s-4);
  overflow-x: auto;
  padding-bottom: 6px;
  align-items: start;
}
.kanban__col {
  display: flex;
  flex-direction: column;
  min-width: 250px;
  background: var(--surface-sunken);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
}
.kanban__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  padding: 10px 12px;
  border-bottom: var(--rule-w) solid var(--line);
}
.kanban__title { font-size: var(--fs--2); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-subtle); font-weight: var(--weight-semibold); }
.kanban__count { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); }
.kanban__body { display: grid; gap: var(--s-2); padding: var(--s-2); align-content: start; min-height: 84px; }
.kanban__empty { font-size: var(--fs--2); color: var(--ink-faint); text-align: center; padding: var(--s-4) 0; margin: 0; }
.kanban__foot { padding: 8px 12px; border-top: var(--rule-w) solid var(--line); font-size: var(--fs--2); color: var(--ink-faint); }

.kcard {
  display: grid;
  gap: 7px;
  width: 100%;
  padding: 10px;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface-raised);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: border-color var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast) var(--motion-ease);
}
.kcard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
.kcard.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-quiet); }
.kcard__top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.kcard__id { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); }
.kcard__title { font-size: var(--fs--1); line-height: 1.35; color: var(--ink); }
.kcard__meta { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-size: var(--fs--2); color: var(--ink-faint); }
.kcard__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }

/* Month grid, attendance, rotas, editorial calendars. */
.cal {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: var(--rule-w) solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.cal__dow {
  background: var(--surface-sunken);
  padding: 7px 6px;
  text-align: center;
  font-size: var(--fs--2);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.cal__day {
  display: grid;
  align-content: start;
  gap: 3px;
  min-height: 70px;
  padding: 7px;
  border: 0;
  background: var(--surface-raised);
  font: inherit;
  font-size: var(--fs--2);
  color: var(--ink-muted);
  text-align: left;
  cursor: pointer;
  transition: background var(--motion-fast) linear;
}
.cal__day:hover { background: var(--surface-sunken); }
.cal__day.is-muted { background: color-mix(in srgb, var(--surface-sunken) 55%, var(--surface-raised)); color: var(--ink-faint); cursor: default; }
.cal__day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal__day.is-selected { background: var(--surface-accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cal__n { font-family: var(--font-mono); font-size: var(--fs--2); color: var(--ink-faint); }
.cal__v { font-size: var(--fs-1); font-weight: var(--weight-semibold); color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.cal__sub { font-size: var(--fs--2); color: var(--ink-faint); }

/* Density heat */
.heat-wrap { display: grid; gap: var(--s-3); justify-items: start; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; }
.heat__c { width: 13px; height: 13px; border-radius: 2px; background: var(--surface-sunken); display: inline-block; }
.heat__c[data-v="1"] { background: color-mix(in srgb, var(--accent) 22%, var(--surface-sunken)); }
.heat__c[data-v="2"] { background: color-mix(in srgb, var(--accent) 42%, var(--surface-sunken)); }
.heat__c[data-v="3"] { background: color-mix(in srgb, var(--accent) 68%, var(--surface-sunken)); }
.heat__c[data-v="4"] { background: var(--accent); }
.heat__key { display: flex; align-items: center; gap: 5px; font-size: var(--fs--2); color: var(--ink-faint); }

/* Delivery route */
.route { list-style: none; display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding: 4px 0; }
